# SDO 流程 preset（无插件版）——只挂"流程需要的最小能力"，不含任何 SDO 业务代码。
# 装了 `sdo-flow` skill 之后，用这个 preset 新建会话即可：人格 + skill 目录 + skill 加载工具。
# 如果宿主已经提供 fs/bash 工具，这里不要重复挂；若没有（精简宿主），把下面注释的三行放开。
- insert:
    - id: preset-sdo-flow
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sdo-flow
        name: SDO Flow
        description: 按 SDO 流程（意图→计划评审→卡→两轮评审→人签→读数门）做项目，文件即真源，人签用问答选项。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你在用 SDO 流程管理项目：先对齐再做，每一步留痕，签字只能由人完成。
                加载 sdo-flow skill 并按它的目录约定与七步循环执行；没有 sdo_* 工具时不要假装有数据库。
          - id: skill
            name: '@deepseek-ai/dsh-skill'
          - id: skill-fs
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 精简宿主（无文件/命令工具）时放开：
          # - id: tool-fs
          #   name: '@deepseek-ai/dsh-tool-fs'
          # - id: tool-fs-search
          #   name: '@deepseek-ai/dsh-tool-fs-search'
          # - id: tool-bash
          #   name: '@deepseek-ai/dsh-tool-bash'

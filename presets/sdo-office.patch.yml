# presets/sdo-office.patch.yml —— 唯一 preset（单会话入口，C-09）
#
# 这是本插件的**唯一入口**：插件行只出现在这里，profile 层没有本插件的行。
# 因此"未选择该 preset 的会话完全不加载 SDO"是装配层保证的（E2E-09 / AC-007）。
#
# 覆盖方式（Q-08 实测结论）：patch 的 `config` 是**整体替换**；
# 要定制请在自己的 profile patch 里写**同 id**（`preset-sdo-office`）的行并给出完整
# `config.plugins`。**不要**再 `insert` 一行同 id 的 preset——那会在组合树里留下两行。
- insert:
    - id: preset-sdo-office
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sdo-office
        name: SDO 研发办公室（驾驶舱）
        description: 研发全流程接管：需求审讯 → 架构 → 拆分派发 → 验证 → 交付（含看板与成本）
        order: 1
        plugins:
          # ① 本插件自身：SDO 引擎（工具/命令/注入/门禁/看板/成本）
          # ① planning 组：SDO 引擎 + plan-mode —— **提供者与消费者必须同 realm**（`isolate` 只隔离 planMode，
          #    其它服务不受影响）。宿主层 `dsh-web-app/cordis.patch.yml` 把 `- id: plan-mode` 设为 disabled，
          #    web profile 里本来就没有这个服务 ⇒ **必须由本 preset 补挂**（与 tool-skill / tool-fs-search 同类）。
          #    形状照抄官方 standard preset 的 planning 组；0.2.1 起 preset 泄漏审计（mountPreset → leakedServices）
          #    要求"preset 子树里注册的服务写在 isolate realm 里"，否则报 `Preset services require isolate realms: planMode`
          #    并**整个 preset 注册失败**（2026-10-09 真机实测：装进 0.2.1-alpha.1 新实例后启动会话即报此错）。
          #    为什么 `sdo` 也在组里：`isolate` 让 planMode 成为**本组私有**实例，组外的消费者取不到它
          #    （`designPrecondition` 依赖 `ctx.planMode`，见历史缺陷"架构阶段永久阻塞"）。
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: sdo
                name: 'dsh-software-dev-office'
                config:
                  projectDir: .sdo
                  injectStatus: true
                  promptOrder: 240
                  statusChars: 1500
                  lang: zh-CN
                  gateLevel: enforce                 # suggest | enforce | strict
                  commandEcho: echo
                  # 受**写入范围纪律**管辖的工具：带路径的（write/edit）逐路径核对本卡 writeScopes；
                  # bash 没有路径可判 ⇒ 如实标 unchecked，靠 `done` 的 A2 对账兜底（2026-10-08 起这两个字段真的生效了）
                  disciplineTools: [write, edit, bash]
                  # **公共放行面**：不受卡写范围约束（台账 / 派生文档 / 用例）
                  disciplineAllowPaths: ['.sdo/', 'docs/', 'test/']
                  registerTools: true
                  registerCommands: true
                  orchestrator: subagent             # native-team（实验性，二选一）| subagent | inline
                  maxParallelDispatch: 4
                  captureWorkspaceChanges: true
                  board: { text: true, panel: false } # panel 自 M6 起可用
                  cost: { enabled: true, warnOnBudget: true }

              # ② 驾驶舱所需的通用行（与 standard preset 同源，按需裁剪）
              # plan-mode 行的 `section` 必须非空（空配置会让装载在子 fiber 静默失败、服务永不注册 —— 历史事故）。
              # 这段文案原先在语言包 `planMode.section`，随声明式改造搬到这里：**preset 行是它的唯一定义处**
              # （`resolveConfig` 的必填字段只能由 preset 给；语言包那份已删除，质量守卫改为读本文件，见 test/m7）。
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你正处于【计划模式】：只做只读探索（读文件、搜索、静态分析、跑检查），不要编辑或写入文件、不要改配置、不要提交；用户的口头同意不算批准，必须用 exit_plan_mode 提交计划给用户评审。这是 SDO 架构阶段的评审前置：评审通过前不落设计。【计划要求】计划必须**结构化**，至少覆盖以下 8 项（每项都要具体到本项目的名字，不要写空话）： 1) 目标与非目标：本轮架构阶段要产出什么、明确不做什么； 2) 关键设计决策：每个决策给出 **≥2 个备选方案** + 取舍理由 + 后果（G3 要求每条 ADR 含备选与后果）； 3) 视图清单：要画哪些视图（逻辑/数据/接口/部署/其他），每个视图准备表达什么； 4) 组件与契约：组件划分、跨组件交互、哪些交互必须落契约、各自的写范围边界； 5) 追溯计划：哪些需求（REQ-xxx）会映射到哪些设计元素（DES-xxx），如何避免孤儿； 6) 风险与缓解：高风险条目**必须**带缓解措施与责任人； 7) 任务拆分预览：卡片粒度、DoD、依赖顺序、每张卡的写范围（避免互相覆盖）； 8) 测试计划：must 级需求如何被用例覆盖； 提交前请用 sdo_gate action=check gate=架构门禁 逐条自检；提交时用 exit_plan_mode，并在计划末尾列出**希望用户重点确认的 2~3 个问题**。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你是 SDO 研发办公室的驾驶舱：按软件工程流程推进项目，先问清楚再动手，门禁未过不得进入下一阶段。'
              suffix: 'Your working directory is {{cwd}}.'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          # `glob` / `grep` 在**搜索族**里，不在 `tool-fs`（后者只给 read/write/edit/read_image）。
          # 与 `tool-skill` 同理：宿主层有意 `disabled: true`（`dsh-web-app/cordis.patch.yml:472`），
          # 必须由 preset 补挂 —— 否则八个角色的 allow 里的 `grep`/`glob` 全是**死允许项**，
          # 而 README/提示词都假定能搜索。standard preset 同样挂着这一行。
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            # **必填 config**（没有默认值）：缺它挂载期校验就是
            #   `tool-fs-search (@deepseek-ai/dsh-tool-fs-search): invalid config:
            #    - $sampleOverCapGlobResult missing required value`
            # 而这一行失败会让**整个 preset 注册失败**（症状：会话里选不到 sdo-office —— 实测过一次）。
            # 官方 standard / ptc / cordis 三个 preset 同样给 false（glob 超上限时保留前 N 条、不跨顶层采样）。
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 技能目录 + 加载器（`skill` 工具）。宿主层**有意关掉**这一行
          # （`dsh-web-app/cordis.patch.yml`：`tool-skill: disabled: true`，注释写明
          # "tool-skill is what a preset mounts to give its agent the catalog and loader at all"），
          # 因此**必须由本 preset 挂载**：否则本插件注册的角色卡索引
          # （`sdo-role-cards`）既没有目录项、也没有加载器 —— 注册成功但无人可见。
          # 只挂 `tool-skill`、不挂 `skill-filesystem`：SDO 走**程序化注册**（runtime 层），
          # 不需要文件发现；挂了会把 `skills/` 下 8 张卡各自变成一个目录项，违背"只占 1 行"的取舍。
          # 该包与 dsh 发行的 `@deepseek-ai/dsh-tool-fs` / `dsh-tool-bash` 同类（同在 dsh 应用依赖里），
          # 解析路径同源。
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 计划评审的 plan-mode 行见上方 planning 组（2026-10-09 改为声明式；原"动态 import 自挂"已删除）。
          # Q-17 的"两道评审"由已装配的提问通道承担（见下方 tool-ask-user）。
          # 上下文压缩与工具结果剪枝（照抄官方 standard preset 的形状）。
          # 不装这三行 ⇒ SDO 会话上下文只增不减：实测 599 次工具调用后 messages 涨到 ~803k tokens，
          # 叠加 completion 预算 256k 直接撞上 1,048,576 上限（现象就是"上下文爆了"）。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate: { workflowEngine: true }
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config: { provider: spawn, toolName: subagent, backgroundMode: continuable }
              # 子代理控制面（`send_message` / `interrupt_agent`）：宿主层同样 `disabled: true`
              # （`dsh-web-app/cordis.patch.yml:525`），必须由 preset 补挂。这一行是**承诺兑现**：
              # SDO 自己的回执（`k105`）与 README「已知边界」都写着"当前由流程官用 `send_message`
              # 把提示词交给执行者"，而 `tool-subagent` 的工具描述也提到 `send_message` ——
              # 不挂它，该会话里根本没有这个工具。必须与 `tool-subagent` 同组（同一个 isolate 域）。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              # 配套：流程官要看已派发的子代理（与 standard preset 同源）。
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

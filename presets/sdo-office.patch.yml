# presets/sdo-office.patch.yml —— 唯一 preset（单会话入口，C-09）
#
# 这是本插件的**唯一入口**：插件行只出现在这里，profile 层没有本插件的行。
# 因此"未选择该 preset 的会话完全不加载 SDO"是装配层保证的（E2E-09 / AC-007）。
#
# 覆盖方式（Q-08 实测结论）：patch 的 `config` 是**整体替换**；
# 要定制请在自己的 profile patch 里写**同 id**（`preset-sdo-office`）的行并给出完整
# `config.plugins`。**不要**再 `insert` 一行同 id 的 preset——那会在组合树里留下两行。
- insert:
    - id: preset-sdo-office
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sdo-office
        name: SDO 研发办公室（驾驶舱）
        description: 研发全流程接管：需求审讯 → 架构 → 拆分派发 → 验证 → 交付（含看板与成本）
        order: 1
        plugins:
          # ① 本插件自身：SDO 引擎（工具/命令/注入/门禁/看板/成本）
          - id: sdo
            name: 'dsh-software-dev-office'
            config:
              projectDir: .sdo
              injectStatus: true
              promptOrder: 240
              statusChars: 1500
              lang: zh-CN
              gateLevel: enforce                 # suggest | enforce | strict
              commandEcho: echo
              disciplineTools: [write, edit, bash]
              disciplineAllowPaths: ['.sdo/', 'docs/', 'test/']
              registerTools: true
              registerCommands: true
              orchestrator: subagent             # native-team（实验性，二选一）| subagent | inline
              maxParallelDispatch: 4
              captureWorkspaceChanges: true
              board: { text: true, panel: false } # panel 自 M6 起可用
              cost: { enabled: true, warnOnBudget: true }

          # ② 驾驶舱所需的通用行（与 standard preset 同源，按需裁剪）
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你是 SDO 研发办公室的驾驶舱：按软件工程流程推进项目，先问清楚再动手，门禁未过不得进入下一阶段。'
              suffix: 'Your working directory is {{cwd}}.'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          # `glob` / `grep` 在**搜索族**里，不在 `tool-fs`（后者只给 read/write/edit/read_image）。
          # 与 `tool-skill` 同理：宿主层有意 `disabled: true`（`dsh-web-app/cordis.patch.yml:472`），
          # 必须由 preset 补挂 —— 否则八个角色的 allow 里的 `grep`/`glob` 全是**死允许项**，
          # 而 README/提示词都假定能搜索。standard preset 同样挂着这一行。
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            # **必填 config**（没有默认值）：缺它挂载期校验就是
            #   `tool-fs-search (@deepseek-ai/dsh-tool-fs-search): invalid config:
            #    - $sampleOverCapGlobResult missing required value`
            # 而这一行失败会让**整个 preset 注册失败**（症状：会话里选不到 sdo-office —— 实测过一次）。
            # 官方 standard / ptc / cordis 三个 preset 同样给 false（glob 超上限时保留前 N 条、不跨顶层采样）。
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 技能目录 + 加载器（`skill` 工具）。宿主层**有意关掉**这一行
          # （`dsh-web-app/cordis.patch.yml`：`tool-skill: disabled: true`，注释写明
          # "tool-skill is what a preset mounts to give its agent the catalog and loader at all"），
          # 因此**必须由本 preset 挂载**：否则本插件注册的角色卡索引
          # （`sdo-role-cards`）既没有目录项、也没有加载器 —— 注册成功但无人可见。
          # 只挂 `tool-skill`、不挂 `skill-filesystem`：SDO 走**程序化注册**（runtime 层），
          # 不需要文件发现；挂了会把 `skills/` 下 8 张卡各自变成一个目录项，违背"只占 1 行"的取舍。
          # 该包与 dsh 发行的 `@deepseek-ai/dsh-tool-fs` / `dsh-tool-bash` 同类（同在 dsh 应用依赖里），
          # 解析路径同源。
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 注：计划评审**不使用** `@deepseek-ai/dsh-plan-mode` 行，改用 `src/index.ts` 的动态
          # import + try/catch 自行装载（方案 A，真机验证可用；装载失败只记原因，不影响其它功能）。
          #
          # 历史理由（"该包只在别处解析得到，preset 里引用会解析失败并拖垮整个 preset"）**没有留存证据**。
          # 复审（2026-10-02 22:48 §3）与本轮的机械实测都指向相反：`@deepseek-ai/dsh-plan-mode` 就在同一个
          # pnpm store 里、是 dsh 应用的依赖、且以 loader 自身为基准可解析 —— 与本轮修好的
          # `@deepseek-ai/dsh-tool-skill` **完全同形**。因此这条结论**可能只是过期**（当时或另有原因）。
          # 是否改成一行声明，需一次真机实测：加 `- id: plan-mode` / `name: '@deepseek-ai/dsh-plan-mode'`
          # → 重启 → 确认 preset 仍可选中；成立再把动态 import 换成声明，并把实测证据补进本注释。
          # 现在**保持现状**（能用且已验证），不拿"未实测的简化"去换"已知能用的路径"。
          # Q-17 的"两道评审"由已装配的提问通道承担（见下方 tool-ask-user）。
          # 上下文压缩与工具结果剪枝（照抄官方 standard preset 的形状）。
          # 不装这三行 ⇒ SDO 会话上下文只增不减：实测 599 次工具调用后 messages 涨到 ~803k tokens，
          # 叠加 completion 预算 256k 直接撞上 1,048,576 上限（现象就是"上下文爆了"）。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate: { workflowEngine: true }
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config: { provider: spawn, toolName: subagent, backgroundMode: continuable }
              # 子代理控制面（`send_message` / `interrupt_agent`）：宿主层同样 `disabled: true`
              # （`dsh-web-app/cordis.patch.yml:525`），必须由 preset 补挂。这一行是**承诺兑现**：
              # SDO 自己的回执（`k105`）与 README「已知边界」都写着"当前由流程官用 `send_message`
              # 把提示词交给执行者"，而 `tool-subagent` 的工具描述也提到 `send_message` ——
              # 不挂它，该会话里根本没有这个工具。必须与 `tool-subagent` 同组（同一个 isolate 域）。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              # 配套：流程官要看已派发的子代理（与 standard preset 同源）。
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

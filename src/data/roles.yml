# SDO 角色掩码表（设计 §8.1 / §9.1）：提示层用 skills/role-*.md，硬约束用这里的 allow/deny。
#
# **两层语义（2026-10-08 用户裁定）**：
#   · **SDO 流程面**（`sdo_*`，本插件自己注册的封闭集合）—— **白名单**：`allow` 里没列的 `sdo_*`
#     一律进下发的 deny 面（developer 拿不到 `sdo_gate`、reviewer 拿不到 `sdo_test`…这是**职责分离**）；
#   · **通用面**（宿主/harness 的 `read`/`write`/`bash`/`skill`/记忆/技能/联网…）—— **黑名单**：
#     只有这里的 `deny` 明写挡住的才挡，其余**继承宿主默认**。旧口径把 `allow` 当**整体**白名单下发，
#     等于连通用面一起清空（真机事故：子代理报「无法使用 `technique_apply`」）。
#   ⇒ 想把某个**通用**工具限制给特定角色（例如只给 analyst 的 `ask_user_question`），做法是
#     在**其他角色**的 `deny` 里写它 —— 写在这里才是真源，改提示词不算数。
#
# **执行者禁令（代码侧常量，不写进本表）**：被派发的执行者不得再**起一个 agent 运行**
# （`subagent` / `subagent_fork` / `workflow` / `sdo_plan`）—— 那会派出一个**不带角色掩码**的子代理，
# 等于绕开本表。它由 `domain/roles.ts` 的 `EXECUTOR_FORBIDDEN_TOOLS` 统一施加（8 个角色一视同仁），
# 且只对**子会话**生效（驾驶舱即使认领了卡也仍能派发）。
#
# **`sdo_task` 是协议通道**：任何角色都要能 claim/done/block 自己那张卡，所以 8 个角色都必须在 allow 里
# （缺口会导致「认领即锁死」：占住卡却无法完成或挂起 —— 评审 2026-10-03 F1）。
#
# **写入控制分两层，别把两层混成一层（2026-10-08 用户裁定）**：
#   ① **工具级**（本表）：谁能写（`write`/`edit`/`bash`）—— 只读角色（red-team / reviewer）一条都没有。
#   ② **路径级**（`domain/writeScope.ts` + 配置 `disciplineTools` / `disciplineAllowPaths`）：
#      写得下去写不下去由**路径**决定 —— 必须落在本次**活卡的 `writeScopes`** 内，公共面
#      （`.sdo/` 台账、`docs/` 派生文档、`test/`）不受卡范围约束；没认领就只能写公共面。
#   ⇒ 所以 **`write` 与 `edit` 必须同权**（谁能写谁就能改）：只给 `write` 不给 `edit` 不代表更安全
#     （`write` 一样能整篇覆盖、`bash` 更能），只会把「改一处」逼成「读全文→整篇写回」——
#     真机 architect 正是这么把登记簿覆盖掉、23 条 DEV 正文永久丢失的（SDO-23）。
roles:
  - code: analyst
    name: 产品/需求分析师
    allow: [skill, read, grep, glob, write, edit, sdo_requirement, sdo_project, sdo_trace, sdo_task, ask_user_question]
    deny: [sdo_redteam, bash, sdo_review]
    rationale: 不得自跑红队（红队必须独立）；不跑 bash；**不改实现**由写范围纪律机械保证（写不了 `src/`）
  - code: red-team
    name: 需求红队
    allow: [skill, read, grep, glob, sdo_requirement, sdo_redteam, sdo_task]
    deny: [write, edit, bash, ask_user_question, sdo_design, sdo_review]
    rationale: 只质询不落笔（不得改需求：sdo_requirement 只许用 list 读，不许 capture/update/change/baseline）；不得无追溯地提建议
  - code: architect
    name: 架构师
    allow: [skill, read, grep, glob, write, edit, sdo_design, sdo_adr, sdo_quality, sdo_trace, sdo_task]
    deny: [bash, ask_user_question, sdo_requirement, sdo_deliver]
    rationale: 设计写入受计划评审约束；不改需求、不打包。**开放 `edit`**（且现已有路径级写范围纪律兜底）（SDO-23：此前无 `edit` 只能「read 全文 → 整篇 write」，真机上直接导致登记簿被覆盖、23 条 DEV 正文永久丢失）
  # **`sdo_release` 只登记在 office 这一行**（`TASK-199` 处置 `REV-082#3`）：
  #   · `sdo_release` —— `sign` 只走问答通道（`channel=question`），问答只在**使用者会话**里成立
  #     （ADR-033：「签只在使用者会话」）⇒ 只给 office，**七个派发角色一条都不写**。本表的 `sdo_*` 是
  #     **白名单**语义（见文件头第 4 行）：不写就是默认拒，`toolDenyList` 会把白名单的补集下发成 deny 面。
  # **守卫（缺口不再靠人发现）**：`test/m222.test.ts` 的 `M222-14` 从**工具注册表现算**，任何**已注册**的
  # `sdo_*` 只要在本表里没有任何角色的 `allow` 命中就判红并**点名**。若某个工具**有意**哪个角色都不给
  # （只在驾驶舱用），必须在本文件的 `cockpitOnly:` 一节里显式写豁免与理由 —— 形状：
  #   cockpitOnly:
  #     - tool: sdo_<工具名>
  #       reason: <为什么刻意不登记给任何角色；空理由会被判红>
  # 豁免条目本身也受检查：工具必须**已注册**（不许给不存在的工具挂豁免）、理由不得为空、已被某个角色
  # `allow` 登记的工具不许再挂豁免（多余豁免会遮蔽真正的回归）。
  # ══ office（流程官）＝ **主会话身份**（`ADR-031` / `ADR-033` / `DEF-181` / `TASK-189`）══
  # 六组写定，**权威声明在代码侧**（`domain/roles.ts` 的 `OFFICE_TOOL_GROUPS`）——本段与它必须
  # **逐项一致**，守卫 `test/m225.test.ts` 的 M225-R5 现算对账（一处改了另一处没改当场红）。
  #   ① identity  只读检视 + skill + 问用户 + 计划模式
  #   ② process   流程面全集（含 `sdo_release`：签字只在使用者会话，派发角色一条都不写）
  #   ③ record    `sdo_test` / `sdo_review` **给**（禁自采自评靠工具内置独立性校验，不靠掩码）
  #   ④ ledger    `write` / `edit` —— **路径级**只限 `.sdo/` 与 `docs/`（`test/` 已从 office 的公共面移除）
  #   ⑤ bash      `ADR-031` 要求不给 ⇒ 本卡**不动它**（现状 `deny: [bash]` 已挡），
  #               `TASK-190` 负责收口公告面/presets 的连带（本卡不提前收）
  #   ⑥ dispatch  不给派发族（`subagent`/`subagent_fork`/`workflow`/`send_message`）——派发只走 `sdo_plan`；
  #               落实在代码侧 `EXECUTOR_FORBIDDEN_TOOLS`/`EXECUTOR_DENIED_TOOLS`（office 永不作为派发目标）
  - code: office
    name: 流程官/PM
    allow: [read, grep, glob, skill, ask_user_question, exit_plan_mode, sdo_init, sdo_status, sdo_project, sdo_requirement, sdo_design, sdo_plan, sdo_task, sdo_gate, sdo_risk, sdo_cost, sdo_feasibility, sdo_redteam, sdo_render, sdo_trace, sdo_deliver, sdo_quality, sdo_adr, sdo_hash, sdo_lang, sdo_release, sdo_test, sdo_review, write, edit]
    # `ask_user_question` 按 `ADR-031` ① 已移出 deny（流程官要能问用户）；
    # `bash` 按 `ADR-031` ⑤ 继续挡着 —— 本卡**不提前收**公告面与 presets 的连带（那是 `TASK-190`）。
    deny: [bash]
    rationale: 主会话身份＝流程官（ADR-031/033）：能推门禁与派发、能问用户、能记录用例与评审（但禁自采自评）；**手维 `.sdo/` 手可编辑真源需要 `edit`**（整篇 write 会丢内容，SDO-23 同类）；写范围只限 `.sdo/` 与 `docs/`（`test/` 不在公共面）；**`sdo_release` 只在这里登记**（签字只在使用者会话，派发角色默认拒）；bash 仍挡着（ADR-031 ⑤），公告面/presets 的连带由 TASK-190 收口
  - code: developer
    name: 实现工程师
    allow: [skill, read, grep, glob, write, edit, bash, sdo_task, sdo_trace, sdo_test]
    deny: [ask_user_question, sdo_review, sdo_gate, sdo_requirement, sdo_design]
    rationale: 不可见评审（不得自评）；不得改契约与需求（走 CR）
  - code: tester
    name: 测试工程师
    allow: [skill, read, grep, glob, write, edit, bash, sdo_test, sdo_task, sdo_trace]
    deny: [ask_user_question, sdo_review, sdo_requirement]
    rationale: 独立性靠**写范围纪律**（只能写本卡 writeScopes + 公共面），不靠「没有 edit」—— 测试脚本写错了要能改（旧口径把改一处逼成整篇重写，SDO-23 同类风险）；不改被测实现 = 写不了 `src/`
  - code: reviewer
    name: 评审员
    allow: [skill, read, grep, glob, sdo_review, sdo_task, sdo_trace, sdo_hash]
    deny: [write, edit, bash, ask_user_question, sdo_test]
    rationale: 只读评审；不得评审自己的产物
  - code: delivery
    name: 交付官
    allow: [skill, read, grep, glob, write, edit, bash, sdo_deliver, sdo_trace, sdo_render, sdo_task]
    deny: [ask_user_question, sdo_review, sdo_requirement, sdo_design]
    rationale: 不得发布/上线（非目标）；不得改需求与设计（`sdo_*` 白名单）；交付清单要能外科手术式修改

# **只在驾驶舱可调的工具**（豁免「已注册 ⇒ 至少一个角色可调」这条守卫）
#
# 形状：`tool` 必须是**已注册**的 `sdo_*`，`reason` 不得为空（空理由不算豁免 —— 那会把"缺口"洗成"决策"）。
# 已被某个角色 `allow` 登记的工具**不许**再挂豁免：多余豁免会遮蔽真正的回归（下次它从 allow 里掉了也照样绿）。
# 守卫在 `test/m222.test.ts` 的 `M222-14` 里现算（工具注册表 × 本文件的 `roles[].allow` × 这一节）。
# **当前没有豁免条目**（`TASK-189` 起）：原先给 `sdo_lang` 挂的 `cockpitOnly` 豁免已**失效并删除** ——
# ADR-031 ② 把 `sdo_lang` 纳入 office（流程官）的流程面，而 office 就是主会话 ⇒ 它不再"哪个角色都
# 拿不到"。`test/m222.test.ts` 的 M222-14 会点名"挂了豁免但已被某个角色 allow"这种失效形态。
cockpitOnly: []

# **未认领子会话的最小面**（DEF-078 / 第五批 §3.1）—— 由**声明**给出，插件里不写任何工具名。
#
# 为什么必须有它：`attributeRole` 对"子会话但既没认领、也没有派发记录"的归属是 `unclaimed-child`
# （角色未知），而旧口径把"角色未知"落成了"**不施加掩码**" ⇒ 它的工具面比**任何**角色都宽
# （第四批复验 V7 实测：权威面 `sdo_plan` 在这个钩子面 **allow**）。
# 而 `roles:` 里只有 8 个真角色 ⇒ 缺的正是这份"默认最小面"。
#
# **语义与 `roles[].allow`/`deny` 逐字相同**（`maskAllows` 同一条出口，不另写一套判据）：
#   · SDO 流程面（`sdo_*`）—— 白名单：`allow` 里没列的**一律收窄**；
#   · 通用面（`read`/`write`/`bash`/…）—— 黑名单：只有列进 `deny` 的才挡，其余继承宿主默认。
# 于是"最小面"的组成**只在这份声明里**：加一条就放宽一项，删一条就收窄一项，插件代码一字不动。
#
# **必须保留**（认领是它拿到角色的**唯一**途径，挡住认领 = 把正常派发卡死）：
#   · `sdo_task`（claim / release / report 等协议通道）、`sdo_status`、`sdo_hash`（只读核查面）；
#   · `read` / `grep` / `glob`（`READ_ONLY_INSPECTION_TOOLS` 在代码里已对**所有**面并入，含 `read_image`）。
# **应当收窄**：权威面（`sdo_plan` 派发 / `sdo_gate` 签字豁免 / `sdo_deliver` 交付 / `sdo_review` 评审）
# 与其余流程面（SDO 白名单自然收窄）；写类（`write` / `edit` / `bash`）显式挡住 ——
# 它还没有卡，写不出任何**合法**的东西（路径级写范围闸门只放公共面）。
unclaimed:
  name: 未认领的子会话（角色未知）
  allow: [sdo_task, sdo_status, sdo_hash]
  deny: [write, edit, bash, ask_user_question]
  rationale: 角色未知 ⇒ 只保留「认领 + 探查 + 只读核查」，权威面与写类全部收窄；认领之后一切照旧（掩码换成那张卡的角色面）

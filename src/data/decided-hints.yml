# 设计缺口 key → 「既有决策」（ADR）的识别关键词（F-5）。
#
# 为什么是数据文件而不是代码里的字面量：
#   · 这些词是**匹配数据**，不是给用户看的文案 —— 放进语言包会被当文案翻译/校验；
#   · 中英两种写法都要收（ADR 是用户写的，语言与插件语言包未必一致），
#     放在这里就与语言包解耦：切到 en 也照样能认出中文 ADR。
#
# 命中范围：只扫 ADR 的 title / context / decision（**不扫** consequences 与 alternatives ——
# "考虑过但否决了"的方案不算已定案）。只认仍然有效的 ADR（proposed / accepted）。

  methodOoCost: "The domain model must be finished first; needs stable requirements"
  methodAgile: "Agile-evolutionary evolutionary (technical debt + reversibility + per-iteration increment)"
  methodAgileCost: "The technical-debt ledger and design increments must be maintained continuously"
  methodHybrid: "Combined (structured core + object-oriented front end)"
  methodHybridCost: "You must state which part uses which; a fuzzy boundary leaves both halves incomplete"
  methodRecommendDefault: "Agile-evolutionary evolutionary (small steps + evolution records)"
  methodRecommendWhy: "Requirements are still evolving and delivery must show value soon; small steps plus a design-decision record are steadier than one full modelling pass"
  # Shape and deployment
  qFormText: "Which shape does this project take: monolith / layered / microservices?"
  qFormWhy: "The shape decides every later design element, contract and split; the agent must not choose it for you"
  qFormConsequence: "Different shapes differ by an order of magnitude in contract count and deployment complexity; changing later is a full rework"
  formMonolith: "Monolith (a single process)"
  formMonolithCost: "Splitting later costs a refactor"
  formLayered: "Layered (layers inside one process, clear interface boundaries)"
  formLayeredCost: "Layer constraints must be maintained and violations checked"
  formMicro: "Microservices (one process per domain)"
  formMicroCost: "Brings distributed transactions, operations and integration cost"
  formRecommend: "Layered (layers inside one process, clear interface boundaries)"
  formRecommendWhy: "Layering buys clear interface boundaries first; split into services along those boundaries once scale demands it. Starting with microservices pays the distributed complexity up front"
  qDeployText: "What are the deployment target and topology?"
  qDeployWhy: "Deployment decides the runtime view, configuration and rollback means"
  qDeployConsequence: "With no deployment shape, the runtime view can only be imagined, and missing pieces surface at release time"
  deploySingle: "Single-host process (behind a reverse proxy)"
  deploySingleCost: "Scaling means more machines; failover is yours to build"
  deployContainer: "Container orchestration (multiple instances + health checks)"
  deployContainerCost: "Images, manifests and rolling releases must be maintained"
  deployManaged: "Managed platform (Serverless / PaaS)"
  deployManagedCost: "Platform limits apply, and the local reproduction differs"
  deployRecommend: "Container orchestration (multiple instances + health checks)"
  deployRecommendWhy: "Orchestration gives a reproducible runtime and rollback point at lower cost than a self-built scheduler, without locking the runtime the way a managed platform does"
  qExternalText: "Should external dependencies be introduced (third-party libraries / external services)?"
  qExternalWhy: "External dependencies add supply-chain and availability risk, so the user must decide"
  qExternalConsequence: "Once a dependency is added silently and breaks, nobody can say who approved it"
  externalMin: "Minimal dependencies (standard library and proven components only)"
  externalMinCost: "Some capabilities must be written in-house; slower at the start"
  externalReuse: "Reuse mature components (OSS libraries and external services allowed)"
  externalReuseCost: "A dependency list, licences and an upgrade rhythm must be maintained"
  externalBuild: "Build in-house (critical capabilities depend on nothing external)"
  externalBuildCost: "Highest engineering investment and ongoing maintenance cost"
  externalRecommend: "Reuse mature components (OSS libraries and external services allowed)"
  externalRecommendWhy: "Locking the critical path into self-built code is the costliest option; mature components plus an explicit dependency list and locking policy keep the risk manageable"
  # Data
  qStoreText: "Which data store do we choose?"
  qStoreWhy: "The store decides the data view, transaction boundaries and migration approach"
  qStoreConsequence: "With no store fixed, the data view and consistency plan have nothing to attach to"
  storeRelational: "Relational (strict schema + transactions)"
  storeRelationalCost: "Schema changes require migration scripts"
  storeDocument: "Document store (flexible schema)"
  storeDocumentCost: "Consistency and joins are yours to guarantee"
  storeFile: "File / embedded (single host, zero operations)"
  storeFileCost: "Concurrent writes and capacity are bounded"
  storeRecommend: "Relational (strict schema + transactions)"
  storeRecommendWhy: "The core data here has clear consistency requirements; a strict schema surfaces data-model problems early instead of at runtime"
  qConsistencyText: "How are consistency and transaction boundaries defined?"
  qConsistencyWhy: "The strength of consistency decides the business consequence of a failure; that is a business decision"
  qConsistencyConsequence: "With no consistency rule, reconciliation differences appear and nobody can say which side is right"
  consistencyStrong: "Strong (completed in a single transaction)"
  consistencyStrongCost: "Throughput is bounded; cross-service calls need distributed transactions"
  consistencyEventual: "Eventual (asynchronous sync + reconciliation)"
  consistencyEventualCost: "Reconciliation and compensation jobs must be built"
  consistencyNone: "No consistency handling (each side writes independently)"
  consistencyNoneCost: "Differences are found by hand only; incidents are uncontrolled"
  consistencyRecommend: "Eventual (asynchronous sync + reconciliation)"
  consistencyRecommendWhy: "Eventual consistency plus reconciliation as a backstop is easier to land than strong consistency, and far more checkable than leaving it unmanaged"
  qRetentionText: "What are the data retention and migration policies?"
  qRetentionWhy: "Retention periods and migration approach affect compliance and capacity planning"
  qRetentionConsequence: "A missing retention policy leaves you exposed at the next compliance audit or capacity crunch"
  retentionKeep: "Keep forever (no deletion)"
  retentionKeepCost: "Capacity and privacy-compliance pressure grows over time"
  retentionArchive: "Hot data + archive (periodically moved cold)"
  retentionArchiveCost: "Archiving and lookup tooling must be written"
  retentionPurge: "Time-boxed purge (delete on expiry)"
  retentionPurgeCost: "A purge job must be written and kept auditable"
  retentionRecommend: "Hot data + archive (periodically moved cold)"
  retentionRecommendWhy: "It bounds online capacity while keeping a queryable history; outright deletion destroys the evidence you need during an incident"
  # Concurrency and performance
  qConcurrencyText: "Which concurrency model do we use?"
  qConcurrencyWhy: "The concurrency model decides locking, idempotency and resource limits, and affects correctness"
  qConcurrencyConsequence: "An unclear concurrency rule brings races and duplicate processing that are hard to reproduce"
  concurrencySimple: "Single writer (serialized processing)"
  concurrencySimpleCost: "Throughput is capped by the single point"
  concurrencyPerUser: "Isolated per user/tenant (own queue each)"
  concurrencyPerUserCost: "Isolation and quotas must be handled"
  concurrencyPool: "Shared connection pool + optimistic locking"
  concurrencyPoolCost: "Conflict retries and lock granularity must be handled"
  concurrencyRecommend: "Shared connection pool + optimistic locking"
  concurrencyRecommendWhy: "It balances throughput against implementation complexity; optimistic locking turns a conflict into a retry you can handle instead of implicit serialization"
  qPerfText: "What is the performance budget (hard latency/throughput targets)?"
  qPerfWhy: "Without hard targets no performance design can be judged sufficient"
  qPerfConsequence: "With no performance target, quality scenarios cannot be judged and tuning becomes guesswork"
  perfDefault: "Use the default budget (P99 < 500ms, 100 QPS per host)"
  perfDefaultCost: "The target is conservative and may cost some capability"
  perfStrict: "Tighten the budget (P99 < 200ms, horizontally scalable)"
  perfStrictCost: "Indexes, caching and load tests must come early"
  perfLater: "Defer the budget (functionality first)"
  perfLaterCost: "Performance debt is deferred and may overturn the existing design"
  perfRecommend: "Use the default budget (P99 < 500ms, 100 QPS per host)"
  perfRecommendWhy: "The default is measurable without being harsh; close the functional loop first and tighten against measurements, avoiding premature optimization"
  qFailureText: "What are the failure semantics and timeout/retry rules (is it idempotent)?"
  qFailureWhy: "Whether retries are safe decides whether they can be automatic; it is a hard precondition of interface design"
  qFailureConsequence: "Unclear retry semantics produce double charges and duplicate records"
  failureIdempotent: "All writes idempotent (safe to retry)"
  failureIdempotentCost: "Idempotency keys and a dedup store must be introduced"
  failureRetry: "Retry reads only; writes need human confirmation"
  failureRetryCost: "Failures need a human, so recovery is slow"
  failureManual: "No automatic retry (fail and report)"
  failureManualCost: "Even transient faults reach the user directly"
  failureRecommend: "All writes idempotent (safe to retry)"
  failureRecommendWhy: "Idempotency is the precondition for automatic retry; a small investment in idempotency keys removes a great deal of manual recovery"
  # Errors and observability
  qErrorText: "What is the error-handling stance (fail fast / tolerate and continue / degrade silently)?"
  qErrorWhy: "The stance decides what the user sees and what the log/alert conditions are"
  qErrorConsequence: "Without a stance the same error is handled in opposite ways on different paths"
  errorFailFast: "Fail fast (rather unavailable than untrustworthy)"
  errorFailFastCost: "A single-point failure becomes visible to users"
  errorTolerant: "Tolerate and continue (skip bad data and alert)"
  errorTolerantCost: "Bad data must not spread silently"
  errorSilent: "Degrade silently (return defaults and continue)"
  errorSilentCost: "Real faults may be masked"
  errorRecommend: "Fail fast (rather unavailable than untrustworthy)"
  errorRecommendWhy: "Guarantee trustworthy results first; add degradation paths once clear monitoring and conditions exist, otherwise faults are swallowed silently"
  qObserveText: "What are the logging / metrics / alerting requirements?"
  qObserveWhy: "Observability decides whether an incident can be located; it is a hard design requirement"
  qObserveConsequence: "Without observability, faults are discovered only through user complaints"
  observeLog: "Structured logs + error reporting"
  observeLogCost: "Investigations start with manual aggregation"
  observeMetrics: "Logs + metrics (instrumented critical paths)"
  observeMetricsCost: "Metric definitions and dashboards must be written"
  observeFull: "Logs + metrics + alert thresholds (self-healing)"
  observeFullCost: "Alert rules need continuous tuning or they become noise"
  observeRecommend: "Logs + metrics (instrumented critical paths)"
  observeRecommendWhy: "Instrumenting the critical paths covers the great majority of investigations at far lower cost than a full alerting system; set thresholds once real failure samples exist"
  # Evolution
  qEvolveText: "Are breaking changes allowed, and how long is the compatibility window?"
  qEvolveWhy: "The compatibility policy decides how much room interfaces and data models have to evolve; it is an agreement with consumers"
  qEvolveConsequence: "An unclear compatibility rule breaks existing callers without warning"
  evolveNoBreak: "No breaking changes (permanently compatible)"
  evolveNoBreakCost: "Old versions must be maintained indefinitely"
  evolveWindow: "Allowed, with a compatibility window (e.g. one version)"
  evolveWindowCost: "Two versions must be maintained and a sunset process run"
  evolveFree: "Change at will (internal system, no external consumers)"
  evolveFreeCost: "You must assess the blast radius yourself"
  evolveRecommend: "Allowed, with a compatibility window (e.g. one version)"
  evolveRecommendWhy: "An explicit window keeps room to evolve while giving consumers time to migrate; permanent compatibility makes the design ever heavier"
  qDebtText: "What is the technical-debt tolerance?"
  qDebtWhy: "Tolerance decides whether a «do it this way for now» implementation may ship, and it must be recorded as a ledger"
  qDebtConsequence: "Debt accumulates invisibly and every later feature gets slower"
  debtZero: "Zero tolerance (no temporary implementations)"
  debtZeroCost: "Slower delivery early on"
  debtTracked: "Allowed, but recorded and scheduled for repayment"
  debtTrackedCost: "A technical-debt ledger must be maintained"
  debtIgnore: "Allowed and unrecorded (ship first)"
  debtIgnoreCost: "Debt is invisible, so rework cannot be estimated"
  debtRecommend: "Allowed, but recorded and scheduled for repayment"
  debtRecommendWhy: "It gives delivery flexibility while giving every debt item an owner and a repayment date; unrecorded debt merely hides the rework cost"
  # UI dimension (only when the project has a UI)
  qUiStyleText: "What visual style should the pages use?"
  qUiStyleWhy: "The user decides the style; when the agent improvises, that is exactly the «never asked what style I wanted» complaint"
  qUiStyleConsequence: "A style that misses expectations forces a rework of the whole page set"
  uiStyleFollowHost: "Follow the host (reuse the existing design system and tokens)"
  uiStyleFollowHostCost: "Constrained by the existing component library"
  uiStyleMinimal: "Minimal (black, white, greys + one accent colour)"
  uiStyleMinimalCost: "Base component styles must be built in-house"
  uiStyleEnterprise: "Enterprise (information-dense, table first)"
  uiStyleEnterpriseCost: "A dense-typography token set and conventions must be defined"
  uiStyleRecommend: "Follow the host (reuse the existing design system and tokens)"
  uiStyleRecommendWhy: "Reusing the existing design system buys consistency and an accessibility baseline immediately; a bespoke style is worth it only when user experience is the core selling point"
  qUiColumnsText: "Which columns should each page carry?"
  qUiColumnsWhy: "Columns are the page's information contract; a page without columns is not designed"
  qUiColumnsConsequence: "With no columns fixed, delivery either misses key information or stuffs in irrelevant data"
  uiColumnsMinimal: "Minimal set (id + title + status + actions)"
  uiColumnsMinimalCost: "Troubleshooting requires opening the detail page"
  uiColumnsStandard: "Standard set (minimal set + owner + updated at)"
  uiColumnsStandardCost: "Wider rows, so narrow screens need handling"
  uiColumnsRich: "Rich set (plus labels/priority and custom columns)"
  uiColumnsRichCost: "Column configuration and persistence must be handled"
  uiColumnsRecommend: "Standard set (minimal set + owner + updated at)"
  uiColumnsRecommendWhy: "The two most common list-page questions are «who owns this» and «is this current»; these columns remove a great deal of clicking"
  qUiLayoutText: "How are the pages laid out (layout and regions)?"
  qUiLayoutWhy: "Layout decides information hierarchy and how reachable actions are; it must not be left to a default template"
  qUiLayoutConsequence: "With no layout fixed, core actions end up buried one level down"
  uiLayoutList: "List first (single column + side filter bar)"
  uiLayoutListCost: "Low information density; long lists scroll"
  uiLayoutTable: "Table first (grid column widths + paging)"
  uiLayoutTableCost: "Narrow screens need a redesign"
  uiLayoutSplit: "Split (list on the left, detail on the right)"
  uiLayoutSplitCost: "Detail navigation logic gets more complex"
  uiLayoutRecommend: "Table first (grid column widths + paging)"
  uiLayoutRecommendWhy: "These pages are mostly structured records, so a table maps the columns straight onto grid columns; narrow screens switch to cards at the breakpoint"
  qUiBreakpointText: "What are the responsive breakpoints and fallback rules?"
  qUiBreakpointWhy: "Breakpoints decide which columns are sacrificed on small screens; that is a product trade-off"
  qUiBreakpointConsequence: "Without breakpoint rules small screens get horizontal scrolling or lose information outright"
  uiBreakpointDesktop: "Desktop only (fixed minimum width)"
  uiBreakpointDesktopCost: "Unusable on mobile"
  uiBreakpointResponsive: "Responsive (sm/md/lg, tables become cards)"
  uiBreakpointResponsiveCost: "Two presentations must be maintained"
  uiBreakpointMobile: "Mobile first (small screen first)"
  uiBreakpointMobileCost: "Desktop information density is limited"
  uiBreakpointRecommend: "Responsive (sm/md/lg, tables become cards)"
  uiBreakpointRecommendWhy: "A desktop-only build blocks high-frequency work such as triage and approvals on a phone; responsive only changes the presentation on narrow screens and adds no interfaces"
  qUiA11yText: "What are the accessibility and contrast requirements?"
  qUiA11yWhy: "Accessibility is a compliance and usability requirement and must be confirmed explicitly"
  qUiA11yConsequence: "With no accessibility target, retrofitting later touches every page"
  uiA11yBasic: "Basic (contrast >= 4.5:1 + keyboard reachable)"
  uiA11yBasicCost: "Each page needs a keyboard walkthrough"
  uiA11yStrict: "Strict (screen-reader usable + focus management)"
  uiA11yStrictCost: "Screen-reader regression tests are required"
  uiA11yLater: "Not required yet (add later)"
  uiA11yLaterCost: "Costly rework later, with compliance risk carried by you"
  uiA11yRecommend: "Basic (contrast >= 4.5:1 + keyboard reachable)"
  uiA11yRecommendWhy: "The basics cost almost nothing during development but touch every page if added later; take on screen readers and focus management once real user demand exists"

planMode:
  section: "You are in [plan mode] — do read-only exploration only (read files, search, static analysis, run checks) — do not edit or write files, do not change configuration, do not commit; the user's verbal agreement does not count as approval, you must submit the plan to the user for review with exit_plan_mode. This is the review precondition for the SDO architecture stage — no design work is written before the review passes. [Plan requirements] The plan must be **structured** and cover at least the following 8 items (each must be concrete with the names of this project, no empty generalities) — 1) Goals and non-goals — what this architecture stage will produce and what it explicitly will not do; 2) Key design decisions — for each decision give **at least 2 alternatives** + rationale for the trade-off + consequences (G3 requires every ADR to include alternatives and consequences); 3) View inventory — which views to draw (logical/data/interface/deployment/other) and what each view is meant to express; 4) Components and contracts — the component breakdown, cross-component interactions, which interactions must become contracts, and the write-scope boundary of each; 5) Traceability plan — which requirements (REQ-xxx) map to which design elements (DES-xxx) and how orphans are avoided; 6) Risks and mitigation — every high-risk item **must** carry a mitigation measure and an owner; 7) Task decomposition preview — card granularity, DoD, dependency order, and the write scope of each card (to avoid overlapping edits); 8) Test plan — how must-level requirements are covered by test cases; Before submitting, self-check item by item with sdo_gate action=check gate=G3; submit with exit_plan_mode, and at the end of the plan list **2–3 questions you most want the user to confirm**."


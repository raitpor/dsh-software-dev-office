  shapeNoteMapEmpty: "{p1} {p2} field {p3} has type {p4}: the mapping contents cannot be inferred, so it was treated as an **empty mapping** (no guessing); write it as indented `key: value` pairs under {p6}:."
  shapeNoteBool: "{p1} {p2} field {p3} has type {p4} (value {p5}): only a boolean counts, so it was treated as **unset** (no guessing); write {p6}: true or {p6}: false."

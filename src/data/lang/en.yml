command:
  noEchoChannel: The host agent has neither inbox.send nor followup
  sdo-init: "Initialise an SDO project: `--name=… [--process=waterfall|prototype|agile|spiral] [--scale=trivial|normal|critical] [--stakeholders=…]`"
  sdo-status: "Show SDO project status (phase, gate gaps, requirement and open-question counts); `--rebuild` forces a rebuild of projections from the journal"
  sdo-board: "Show the SDO text board; `--expand` expands details, `--all` ignores the retention window, `--write` writes it to docs/BOARD.md"
  sdo-list: "List requirements (id / priority / status / ambiguity score / open question count)"
  sdo-grill: "Generate the next batch of interview questions for a requirement (at most 4, each with options and their cost); `--id=REQ-001` narrows it to one requirement, `--quick` asks P0 only"
  sdo-answer: "Answer a question: `--id=Q-0001 --answer=\"…\" [--option=0]`; when the user does not know, use `--assume` (adopt the default suggestion and record it as an assumption)"
  sdo-redteam: "Red team: `--attack` generates challenge questions; `--off` / `--on` toggles the red team for this session (recorded as a redteam/mode event); with no flag it shows the state"
  sdo-gate: "Gates: `--gate=G0` evaluates and records; `--waive --gate=G2 --reason=… --approver=…` waives explicitly (recorded, never silently skipped)"
  sdo-next: "Advance to the next phase (every exit gate of the current phase must already be passed or waived; otherwise you get the gaps and their remedies)"
  sdo-budget: "Cost and budget: `--show` (default) | `--set total=100 [currency=CNY] [tiers=50,80,100]` | `--decide choice=add-budget|waive|narrow-scope [note=…]` (decisions are recorded, **nothing stops automatically**)"
  sdo-render: "Render the `.sdo/` source of truth into human documents (M1: `--target=srs` → docs/SRS.md)"
  sdo-lang: "Show or switch the UI language: `/sdo-lang` to show, `/sdo-lang en` to switch (effective for this process)"


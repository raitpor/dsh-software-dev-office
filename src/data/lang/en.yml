  kConstructionProfileRemedy: "have the flow officer run `sdo_plan action=profile`: at least one `packages` entry and at least one machine-checkable `derivedFrom` (`reqKind=...` / `contractCount=...` / `scale=...`); to opt out use `packages=[]` with a stated reason"

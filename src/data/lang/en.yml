  k1: "JSON object of domain terms, e.g. {\"difference\":\"a record of the same business transaction disagreeing between the two systems\"} (merged into the existing glossary)."
  k2: "The requirement statement — what must be true (\"the system shall …\")."
  k3: "Must be true when recording it as an assumption, it means the **user authorizes** handling it as you propose (without authorization it will be rejected)"
  k4: "Gate name (either the Chinese name or the internal code will do, e.g. \"Feasibility Gate (G1)\", \"Requirements Baseline Gate (G2)\", \"Architecture Gate (G3)\", \"Delivery Gate (G7)\";"

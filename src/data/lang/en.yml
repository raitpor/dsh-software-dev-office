command:
  noEchoChannel: The host agent has neither inbox.send nor followup
  sdo-init: "Initialise an SDO project: `--name=… [--process=waterfall|prototype|agile|spiral] [--scale=trivial|normal|critical] [--stakeholders=…]`"
  sdo-status: "Show SDO project status (phase, gate gaps, requirement and open-question counts); `--rebuild` forces a rebuild of projections from the journal"
  sdo-board: "Show the SDO text board; `--expand` expands details, `--all` ignores the retention window, `--write` writes it to docs/BOARD.md"
  sdo-list: "List requirements (id / priority / status / ambiguity score / open question count)"
  sdo-grill: "Generate the next batch of interview questions for a requirement (at most 4, each with options and their cost); `--id=REQ-001` narrows it to one requirement, `--quick` asks P0 only"
  sdo-answer: "Answer a question: `--id=Q-0001 --answer=… [--option=0] [--dimensions={'goal':2,…}]`; when the user does not know, use `--assume` (adopt the default suggestion and record it as an assumption). The answer text itself does not move the score — pass `--dimensions` to change it."
  sdo-redteam: "Red team: `--attack` generates challenge questions; `--off` / `--on` toggles the red team for this session (recorded as a redteam/mode event); with no flag it shows the state"
  sdo-gate: "Gates: `--gate=G0` evaluates and records; `--sign --gate=G2 --quote=<their words> [--channel=statement|question] [--approved-by=...] [--turn=...]` records the user sign-off (a signature without a quote is always refused); `--rollback --to=<phase> --reason=...` rolls a phase back; `--waive --gate=G2 --reason=... --approver=...` waives explicitly (recorded, never silently skipped)"
  sdo-next: "Advance to the next phase (every exit gate of the current phase must already be passed or waived; otherwise you get the gaps and their remedies)"
  sdo-budget: "Cost and budget: `--show` (default) | `--set --total=100 [--currency=CNY] [--tiers=50,80,100]` | `--decide --choice=add-budget|waive|narrow-scope [--note=…]` (decisions are recorded, **nothing stops automatically**; the legacy `total=100` / `choice=…` forms are still accepted)"
  sdo-render: "Render the `.sdo/` source of truth into human documents (M1: `--target=srs` → docs/SRS.md)"
  sdo-lang: "Show or switch the UI language: `/sdo-lang` to show, `/sdo-lang en` to switch (effective for this process)"
  sdo-design-grill: "Generate the next batch of design questions (including the methodology choice); `--method=... --rationale=...` carries the model recommendation, `--round=N` caps how many are added"
  sdo-design-answer: "Answer a design question: `--id=Q-0001 --choice=0|<option text> [--note=...]`; use `--assume` when the user authorized following your recommendation"
  sdo-design-confirm: "Confirm one key item: `--target=DES-001|CT-001|ui:UI-001:style|SCR-001:columns|SCR-001:layout [--note=...]`; list them with `/sdo-design-issues`"
  sdo-design-issues: "List design questions and the key items that still need confirmation; `--state=all` also lists answered/closed ones"
  sdo-design-render: "Render the design document to docs/DESIGN.md (reads the ledger, writes only the document) and report the path and byte count"

  elementKind: "Free-form element kind: 'system' | 'service' | 'store' | 'queue' | 'external' ..."

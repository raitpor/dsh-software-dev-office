tool:
  sdo_init: "Initialise an SDO project (creates the `.sdo/` ledger in the current working directory). **No key parameter may be omitted**: project name / process / scale / stakeholders — if one is missing the tool does not guess defaults, it returns a questionnaire for you to confirm first."
  sdo_status: "Show project status: current phase, gate awaiting decision, requirement and question counts, the latest gate evaluation, and whether derived projections need rebuilding. Read-only."
  sdo_project: "Maintain the project ledger (19th tool): scope and **non-goals**, stakeholders, glossary, success metrics, development process and scale. `update` writes only the fields you pass explicitly (the glossary merges by key); `show` prints the current ledger."
  sdo_requirement: "Requirements engineering. `capture` records a requirement (with automatic eight-dimension ambiguity scoring), `grill` produces interview questions (each with options and their cost), `answer` records an answer (optionally marked as an assumption), `update` edits or adds Given/When/Then acceptance criteria, `change` runs change control after baselining (impact analysis plus decision; the change may carry scalar fields and/or `acceptance` criteria), `list`, `baseline` freezes the baseline and evaluates the requirements baseline gate."
  sdo_redteam: "Requirements red team: adversarially attacks the requirement set and produces defect-style issues (each must map back to a requirement or be converted into a risk). `off`/`on` toggles the red team for **this session** (recorded); `status` shows the current state."
  sdo_render: "Render the source of truth into documents (derived views, stamped with the source sequence number and a do-not-edit-by-hand notice). Currently supports the requirements specification `srs`."
  sdo_plan: "Task decomposition and dispatch. `decompose` runs both channels (the structural channel follows the trace graph, the model channel consumes suggestions) and applies six mechanical checks; `iteration` opens an iteration; `next` picks dispatchable cards within the capacity budget and emits dispatch requests."
  sdo_task: "Task cards and the collaboration protocol: claiming uses compare-and-swap (a stale revision is a conflict), only the owner may report back, **completion must carry evidence**, and blocked cards must state why. A vanished owner is **never released automatically** — only an explicit release or reassignment (both recorded)."
  sdo_test: "Test plans, results and defects. `plan` writes test cases (binding them to requirement ids is recommended), `record` records results (even passes need evidence), `defect` files or updates a defect (severity/status). Open blocker-level defects block the verification gate."
  sdo_review: "Review records: record the verdict (pass / changes requested / reject) and the findings. **A reviewer may not be the author** — independence is checked mechanically, not left to good intentions."
  sdo_deliver: "Delivery package: artifact manifest (with sha256), acceptance matrix (one row per must-have requirement), rollback point, and an explicit statement that prototype content is excluded. It stops at a deployable artifact; release and operations are explicitly out of scope."
  sdo_cost: "Cost report: tokens consumed; a monetary amount appears only when the user has supplied unit prices, and it is labelled an **estimate** everywhere. The budget is optional — with no total it reports consumption only (no remaining amount, no percentage, no threshold alerts); exceeding the budget **never stops anything**, it only asks a human to top up, waive, or narrow scope. Model read-only."
  sdo_gate: "Gate engine (the process is data, every gate is evaluated criterion by criterion, never guessed). `check` evaluates and records; `advance` moves on only when every exit gate of the current phase passed or was waived; `waive` waives explicitly with a trace. **An unimplemented checker always fails** — \"cannot check\" must never mean \"passes\"."
  sdo_feasibility: "TELOS feasibility assessment (technical / economic / legal / operational / schedule) plus a Go/No-go verdict with reasons and PoC suggestions for the high risks. Together with the risk register it forms the evidence for the feasibility gate."
  sdo_risk: "Risk register. `log` records a risk (level / probability / impact / mitigation / owner, optionally with an origin such as a red-team issue — an origin converts the issue into a risk); `update` changes status or fills in mitigation and owner; `list`; `conclude` writes the per-round risk conclusion for spiral projects."
  sdo_design: "Architecture work, guarded by two gates: the requirements baseline gate has passed and the plan review is complete (SDO drives plan mode itself; with no interactive review channel it **blocks by design** and records the block instead of writing). `create` adds or updates design elements across the five views; `contract` records a cross-component contract (timeout / retry / idempotency); `view` shows the current views."
  sdo_adr: "Architecture decision records. Every record must state the **rejected alternatives** (with their costs) and the **accepted consequences** — a decision that is only a conclusion is refused by the architecture gate. `record` | `list` | `supersede` (the new record supersedes the old one; the old record gains a pointer and is never rewritten)."
  sdo_quality: "Quality attribute scenarios and lightweight ATAM. A scenario states stimulus → response plus a **measurable** metric (indicator + condition + threshold); without numbers it is not a scenario. `evaluate` turns the ATAM outcome into three lists (risks / sensitivities / trade-offs)."
  sdo_trace: "Trace graph (`.sdo/trace/links.jsonl`) — change impact analysis, orphan detection and coverage all read it. `link` creates edges (requirement → design / task / test case, batching supported), `query` shows coverage and orphans, `report` renders the traceability report."
  sdo_lang: "Show or switch the UI language (tool and command descriptions, the status block, gate wording). `action=show` reports the current language and pack coverage; `action=set lang=en` switches immediately (**effective for this process** until restart)."

param:
  designBasisSource: 'action=confirm: `user` (the user confirmed in person, default) or `proxy` (stamped on the user behalf — required when the authorizer is not the executor so the event stays distinguishable)'
  signQuote: "The user own words **for this signature or waiver** (verbatim; shared by `action=sign` and `action=waive`). For `sign`: it must be findable in this session user messages and must NOT be an old quote reused after the last invalidation (R-27, refused); use `channel=question` to obtain a fresh basis. For `waive`: optional — when given it is checked (a mismatch is refused); when omitted the waiver still goes through, but the ledger records `approverChecked: none` and the receipt says the approver has no user-quote basis. The real values of `approverChecked` are `none` (no basis given) / `session` (checked against a HUMAN-sourced utterance) / `role-only` (the host messages carry no provenance, so only the `user` role could be checked — weak calibers) / `unavailable` (session history not reachable) — all four are recorded verbatim in the ledger."
  runsRequired: "action=package: runtime targets this delivery REQUIRES (comma separated, e.g. 'server,client'). A missing target downgrades every pass row to unverified"
  designConfirmBasis: 'action=confirm: the authorized user wording (takes precedence over note/reason; the old implementation ignored it and left only the tool own wording in the event)'
  planFreshChild: 'action=next: force a fresh subagent (do not reuse an idle one). Observed: a single subagent reused for 19 rounds until its context ran out'
  redteamAction: "attack = attack from the question bank; propose = ask the model to generate challenges for a requirement; file = write back model-generated challenges (the plugin validates them); on/off = toggle red-team mode; status = report the current mode."
  requirementId: "Target requirement id for a write-back (REQ-xxx)."
  questions: "JSON text shaped like `[{\"text\":\"…?\",\"dimension\":\"data\",\"options\":[{\"label\":\"…\",\"cost\":\"…\"}],\"recommendation\":\"…\"}]` (only used with action=file). **Only a question with `options` can be answered via `pickedOption`**; one without options takes free-text `answer` only."
  action: Action
  issueId: "Issue id to dispose (only action=dispose): REQ-ISSUE-001."
  disposition: "Where the issue goes: `risk` (converted into a risk) or `requirement` (settled back into the requirements). Only action=dispose."
  disposeNote: "Why it is disposed — written into the issue file and the `issue/closed` event. Only action=dispose."
  id: Identifier (such as REQ-001 / TASK-001 / Q-0001)
  name: Name
  owner: Owner / assignee
  gate: "Gate (accepts a readable name such as \"Intake Gate\", or the id G0)"
  approver: Approver
  approvedBy: Human sign-off (required by the baseline gate)
  evidence: "Evidence JSON text for done. Shape: [{\"kind\":\"command\",\"detail\":\"npm test (420 passed)\",\"exitCode\":0}, {\"kind\":\"artifact\",\"detail\":\"lib/x.js sha256=<64-hex>\"}, {\"kind\":\"workspace-changes\",\"detail\":\"session-...@42\"}]. Checks: kinds must cover the card evidenceRequired; artifact paths must exist (a given hash is recomputed); command exitCode is a SEPARATE FIELD - writing it inside detail text is not read, so pass it as its own field."
  status: Status
  severity: Severity
  kind: Kind
  title: Title
  statement: "Requirement statement (write it as a decidable indicator + condition + threshold)"
  priority: Priority
  level: Level
  probability: Probability
  impact: Impact
  mitigation: Mitigation
  origin: "Origin (for example a red-team issue id; supplying an origin converts the issue into a risk)"
  conclusion: Conclusion
  rationale: Rationale
  note: Note / explanation
  notes: Notes
  limit: Maximum number of rows
  decision: Decision
  decidedBy: Decision maker
  requirements: Requirement ids (JSON text)
  suggestions: "Card suggestions (JSON text). Field names must match the task card: `title` / `dod` (string array) / `writeScopes` (string array, **not** `scope`) / `evidenceRequired` / `blockedBy` (**supports `[「*」]` = after every other card**, for final build / full-verification cards that need an exclusive window) / `role` / `size` / `requirements`. **A wrong key is not reported** and silently lands as empty (observed on a real machine: `scope` produced `writeScopes: []`). Without `writeScopes`, the value is derived in order: the design element responsibility line that declares its scope (see `parseWriteScopes` in `plan.ts`) -> `plan.scopeTemplate` in config.yml -> the `src/<slug>/` placeholder."
  goal: Goal
  backend: Preferred dispatch backend
  expectedRevision: The revision you read (compare-and-swap, used when claiming)
  stage: Stage
  actor: Actor
  artifact: Artifact
  artifacts: "Artifact manifest (JSON text: path + kind)"
  acceptance: Acceptance matrix (JSON text)
  rollbackPoint: Rollback point
  reviewer: Reviewer
  verdict: Verdict
  findings: "record: findings as **JSON text** (e.g. `[\"first\",\"second\"]`), **not an array** — the schema declares a string."
  # —— verify (verifying review findings): a review is a claim; the implementer verifies each finding ——
  reviewId: The review id to verify (`REV-*`)
  reviewIndex: Which finding (**1-based**, matching the "finding N" printed in receipts)
  reviewOutcome: 'Outcome: reproduced (the finding checks out) / refuted (it does not; give counter-evidence)'
  reviewProof: The command and result you reproduced with, or the counter-evidence (required; a bare claim is not verification)
  steps: Steps (JSON text)
  expected: Expected result
  caseId: Test case id
  defectId: Defect id
  requirement: Requirement id
  reporter: Reporter
  designId: Design element id
  dependsOn: "Depended-on element names (comma separated)"
  elementKind: Element kind
  responsibility: Responsibility
  summary: Summary
  schema: "Contract body (structure / fields / example)"
  contractKind: Contract kind
  timeout: Timeout semantics
  retry: Retry semantics
  idempotency: Idempotency semantics
  alternatives: "Alternatives (JSON text, each with its pros and cons)"
  consequences: "Consequences (**JSON text**): each element may be a plain string or `{\"item\":\"consequence\",\"mitigation\":\"mitigation\"}` (mitigation is optional, kept and rendered). What you write is always readable (the read and write shapes are the same)."
  supersedes: Which record this one supersedes
  attribute: Quality attribute
  stimulus: Stimulus (what event triggers it)
  response: Response (what the system does)
  measure: Measurable metric (indicator + condition + threshold)
  targets: "Related design element ids (comma separated)"
  risks: Risks (JSON text)
  sensitivities: Sensitivities (JSON text)
  tradeoffs: Trade-offs (JSON text)
  by: Performed by
  from: Source id
  to: Target id
  links: Edges in bulk (JSON text)
  telos: TELOS five-dimension assessment (JSON text)
  poc: PoC / verification suggestions (JSON text)
  verdictLevel: Verdict level
  scopeIn: "Scope (what we do; comma separated)"
  scopeOut: "Non-goals (what we explicitly do not do; comma separated)"
  metricsSuccess: "Success metrics (measurable; comma separated)"
  glossary: "Glossary (JSON object: term → definition)"
  stakeholders: "Stakeholders (comma separated)"
  process: Development process
  scale: Scale
  rebuild: Whether to rebuild derived projections from the source of truth
  expand: Whether to expand details
  all: Whether to show everything
  write: Whether to write file artifacts
  answer: Answer text
  assume: Whether to record this as an assumption (use when the user has not confirmed)
  dimensions: Eight-dimension scoring (JSON object)
  accepted: Whether the suggested option was accepted
  banned: Whether banned-word questions are included
  redTeam: Whether red-team challenges are included
  quick: Whether to ask only the most critical questions
  target: Render target
  taskId: Task card id
  sourceStakeholder: "Source stakeholder id (such as STK-01). Supply this or sourceRaw — otherwise the requirement is **refused**: every requirement needs a source."
  sourceRaw: "The user's own words / the source document text (**every requirement needs a source**). Supply this or sourceStakeholder."
  pickedOption: "Index of the option the user picked (zero-based). **The index is bound to the plugin's stored `options` array**: if you reordered or reworded the options while relaying them, give the index from the plugin's original list and keep the user's own words in `answer` (the ledger records the index and the label separately so both can be checked later)."
  ids: "Requirement id list, comma separated (default: all requirements)."
  context: "Extra context (free text, recorded in the trace)."
  producer: "The depended-on side: pass its raw dependsOn string (usually the id or name of the design element being depended on). The consumer depends on the producer."
  consumer: "The depending side: pass the **name of the design element that depends on another** (the party that initiates the dependency in the component view)."
  reason: "Reason (recorded for the trace; required when dropping a card, explaining why it is void)."
  lang: "Language pack name (such as `zh-CN` / `en`)"
  langAction: "show = report the current language and translation coverage; set = switch (with lang=<zh-CN|en>)."

  surfaces: "Project-level surfaces (web / desktop / mobile, comma separated): the UI view only enters the gate when a UI surface is declared (§2.1)."
  designKind: "View: 'context' | 'component' | 'runtime' | 'data' | 'deployment' (required by create); kind=ui means the UI view, and then ui=<UI view JSON> must be given too."
  designMethod: "grill: your **design-method recommendation** based on the requirements (structured / object-oriented / agile-evolutionary / combined) — it is required; the user chooses from it."
  designRationale: "grill: the reason for that recommendation, tied to the requirements."
  designRound: "grill: maximum number of new questions this round (omit to ask all gaps at once)."
  designQuestionId: "answer: the design question id (Q-xxxx)."
  designChoice: "answer: zero-based option index, or the option text, or a free-form answer from the user."
  designAssume: "answer: true only when the user explicitly said «go with your recommendation» — no self-answering otherwise."
  designTarget: "confirm: element / contract / UI item id (DES-xxx / CT-xxx / UI-xxx / SCR-xxx:columns / SCR-xxx:layout)."
  designState: "issues: 'open' (default, only unresolved) | 'all' (including answered)."
  designUi: "create kind=ui: UI view JSON, e.g. {style:{source:minimal,tokens:{},rationale:...},screens:[...]}; source is follow-host / minimal / enterprise / custom; screens[].layout may carry stack:vertical|horizontal to declare the region stacking direction explicitly (default vertical; the wireframe states where the direction came from)."
  designArtifactKind: "artifact: method-artefact kind (dictionary | dfd | erd | classes | sequences | layers | debt | reversibility | increments | mapping | invariants | diffVerify)."
  designArtifactData: "artifact: the artefact body as JSON. The only common fields are summary / requires; the body must sit under THIS kind's field (misplaced fields are named in the receipt and no half artefact is written). **List fields are whole-list overwrites**: sending `dictionary` / `sequences` etc. replaces the **entire list** (only `summary` / `requires` leave them untouched); a copy is kept before the overwrite and the receipt says how many entries were replaced. Shapes by kind: dictionary→{dictionary:[{name,type,source,sink,validation}]}; dfd→{levels:[{level,name,flows,processes}]}; erd→{entities:[{name,identifier}],relations:[{name,from,to,cardinality}]}; classes→{types:[{name,kind,layer,responsibility,collaborators}]} (declare a leaf type with leaf:true); sequences→{sequences:[{name,participants,messages}]} (cite the requirement via requires:[REQ-xxx] or requirement:REQ-xxx; the two are normalised on write); layers→{rules:{layers,assignments,allowed}}; debt→{debts:[...]}; reversibility→{decisions:[...]}; increments→{increments:[...]}; mapping→{mappings:[...]}; invariants→{invariants:[...]}; diffVerify→{diffVerify:{...}}."
  designPuml: "render: optional. Pass true for the default target .sdo/design/ui.puml, or a relative path inside the workspace; only the .puml skeleton source is written (this repository has no renderer and produces no diagram)."
redteam:
  fileOptionCount: "　[options: {p1}]"
  proposeHeader: "Red-team challenge proposals (generated by the **model** for specific requirements; the plugin only validates them)"
  proposeInstruction: "For each requirement below, generate {count} adversarial challenges. Requirements: (1) **quote a fragment of that requirement's statement** (a run of 4+ consecutive CJK characters, or a number/word of 3+ characters from the original; generic two-character words do not count); (2) each ends with a question mark and is 6–200 characters; (3) no duplicates of existing questions; (4) state the dimension (goal / user / scenario / data / interface / constraint / acceptance / boundary)."
  proposeMustQuote: "Validation rule: challenges that quote no fragment of the original, do not end with a question mark, or duplicate an existing question are **refused**, and the reason spells out what to add."
  proposeStatement: Requirement statement
  proposeWeak: Dimensions still unclarified for this requirement
  proposeWeakNone: "(all eight dimensions are clarified — ask from an implementation-and-operations risk angle)"
  proposeNone: "No requirements to challenge yet: record one first with sdo_requirement action=capture."
  proposeCallHint: "Once generated, call sdo_redteam action=file requirementId=<REQ-xxx> questions=<JSON text> to write them back; they are stored only after validation passes."
  fileNoRequirement: Requirement {id} not found
  fileNeedId: Writing back red-team challenges requires requirementId.
  fileAccepted: Recorded {n} red-team challenges (model-generated, passed the quote-the-source check)
  fileRejected: Refused {n}
  fileAskHint: "Next: ask the user these challenges with the question tool, then record the answers with sdo_requirement action=answer."
  fileConsequence: If this requirement really is that fragile, it will surface as rework or a production incident during construction or review.
  fileEmpty: Empty content
  fileTooShort: Too short (under 6 characters)
  fileTooLong: Too long (over 200 characters)
  fileNotQuestion: Does not end with a question mark
  fileNoKeyword: Does not quote the requirement's own wording (quote a run of 4+ consecutive CJK characters, or a number/word of 3+ characters from the original; generic two-character words do not count)
  fileDuplicate: Duplicates an existing question

status:
  title: "## SDO Software Dev Office"
  truthError: "WARNING: **reading the source of truth failed**; the state below cannot be trusted: {p1}"
  truthErrorHint: "- Fix the YAML file named by the **relative path** above (hand-written sources may be edited by hand, but must stay a valid YAML subset), then judge again; until then do not treat the counts and gate state below as facts."
  rebuiltLine: "- The projection was rebuilt from the journal (it was unusable on the previous read)."
  uninitSuffix: " (mounted in this session; the current directory is not initialised yet)"
  unverifiedSuffix: " (mounted in this session; the **project projection cannot be read**, so whether it is initialised cannot be confirmed)"
  noDir: "- There is no `{dir}/` in the current working directory."
  noDirUnverified: "- The state of `{dir}/` cannot be read (**this does not mean** it is absent): `{dir}/project.json` is a **derived projection**, so do not hand-fix it — delete it or make one source write and it is rebuilt from the journal; if a hand-written source (a `*.yml` under `.sdo/`) is the broken one, fix it via the relative path above and judge again."
  background: "- This block is **background state**, not a user request: for greetings, code questions or questions about the plugin itself you do **not** need to call any `sdo_*` tool — answer from your own knowledge and the tools you already have."
  initHint: "- **Only when the user wants to start or continue a software project** should you begin with `sdo_init`, then move through the phases."
  projectLine: "- Project: {id} {name} | process {process} | scale {scale} | phase {phase}"
  gateLine: "- Gates: awaiting decision {gate} | {gates} gate records | {requirements} requirements | {questions} ledger questions"
  noGate: (none)
  designOpen: "- **Design phase**: {n} design question(s) await your confirmation -> run `sdo_design action=grill` (draft + question list) and answer them with `action=answer`; `action=issues` lists what is open at any time."
  reproducedFindings: 'Review findings verified as REAL: {n} ({ids}) — verification is not the end: each must land as a change (visible on a card / in the delivery) or be explicitly declined with a reason; the plugin cannot tell which.'
  reviewVerify: "Reviews awaiting verification: {n} ({ids}) — a review is not adopted automatically: the card's **implementing session** must verify each finding (reproduce it, or give counter-evidence) first (`sdo_task action=verify-review id=<card> review=REV-... index=... outcome=reproduced|refuted proof=...`)"
  designNone: "- **Design phase**: no design question is open -> confirm each key item with `sdo_design action=confirm target=...`, then `action=render` to produce `docs/DESIGN.md` for human review. **Order matters**: before writing any design you must also run `sdo_requirement action=baseline` to **freeze the requirements baseline** — a passing G2 is not the same as a frozen baseline (observed on a real machine: 7 DoR criteria green and a valid signature, still refused with \"requirements not baselined\")."

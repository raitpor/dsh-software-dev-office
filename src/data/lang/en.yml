  kConstructionScopeTasks: "{p1} cards"
  kConstructionProfileNa: "method packages not decided or explicitly opted out: this criterion is N/A (the decide criterion reports the failure)"
  kConstructionPackagesOk: "all {p1} completed cards in scope satisfy the selected method packages"
  kConstructionPackagesRemedy: "add the missing deliverables (`.sdo/construction/*.yml`), freeze contracts before claiming, or write an **exemption** (`exempt: [{task, check, why}]`, reason required)"
uiPlan:
  kWriteScopeEmpty: 'the card declares no write scope (writeScopes is empty) — an empty scope neither reserves anything nor is audited for out-of-scope writes (C-31 requires scopes)'
  kWriteScopeEmptyRemedy: 'give the card the path prefixes it will write (e.g. src/booking/); a card that writes no code (a pure review card) should declare what it really writes — normally [".sdo/"] (a reviewer only writes `.sdo/reviews/*.yml`) — or be reshaped with a scope, or dropped explicitly'
  kBlockedHolderNote: ' (that card is blocked: it may resume writing the same scope, so it still holds it exclusively)'
  kScopeReleaseHint: '  (SDO-46) when a blocked card holds it: `sdo_task action=release` or `drop` it first to free the scope.'
  k1: "The change has artifact evidence (path + hash)"
  k2: "Caller implementation"
  k3: "Tests for failure semantics (timeout/retry/idempotency)"
  k4: "The contract's failure semantics are covered by tests"
  k5: "The DoD is empty or contains empty entries"
  k6: "Write a decidable definition of done for this card (at least 1 entry that can clearly pass or fail)"
  k7: "The card is sized large (which means it was never really decomposed)"
  k8: "Keep splitting into medium or smaller (one card = one independently verifiable increment)"
  k9: "No evidence requirement"
  k10: "Provide at least one ('artifact' is the most common; use 'workspace-changes' when multiple files are involved)"
  k11: "Fix the dependencies, or create the depended-on cards first"
  k12: "Break the cycle (usually this means the two cards should be merged into one)"
  k13: "Narrow the write scopes, or chain them as a dependency (blockedBy) — mutually exclusive write scopes are the precondition for safe parallelism"
  t1: "{p1} ({p2})"
  t2: "Implement {p1} ({p2})"

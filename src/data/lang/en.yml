tool:
  sdo_init: "Initialise an SDO project (creates the `.sdo/` ledger in the current working directory). **No key parameter may be omitted**: project name / process / scale / stakeholders — if one is missing the tool does not guess defaults, it returns a questionnaire for you to confirm first."
  sdo_status: "Show project status: current phase, gate awaiting decision, requirement and question counts, the latest gate evaluation, and whether derived projections need rebuilding. Read-only."
  sdo_project: "Maintain the project ledger (19th tool): scope and **non-goals**, stakeholders, glossary, success metrics, development process and scale. `update` writes only the fields you pass explicitly (the glossary merges by key); `show` prints the current ledger."
  sdo_requirement: "Requirements engineering. `capture` records a requirement (with automatic eight-dimension ambiguity scoring), `grill` produces interview questions (each with options and their cost), `answer` records an answer (optionally marked as an assumption), `update` edits or adds Given/When/Then acceptance criteria, `change` runs change control after baselining (impact analysis plus decision), `list`, `baseline` freezes the baseline and evaluates the requirements baseline gate."
  sdo_redteam: "Requirements red team: adversarially attacks the requirement set and produces defect-style issues (each must map back to a requirement or be converted into a risk). `off`/`on` toggles the red team for **this session** (recorded); `status` shows the current state."
  sdo_render: "Render the source of truth into documents (derived views, stamped with the source sequence number and a do-not-edit-by-hand notice). Currently supports the requirements specification `srs`."
  sdo_plan: "Task decomposition and dispatch. `decompose` runs both channels (the structural channel follows the trace graph, the model channel consumes suggestions) and applies six mechanical checks; `iteration` opens an iteration; `next` picks dispatchable cards within the capacity budget and emits dispatch requests."
  sdo_task: "Task cards and the collaboration protocol: claiming uses compare-and-swap (a stale revision is a conflict), only the owner may report back, **completion must carry evidence**, and blocked cards must state why. A vanished owner is **never released automatically** — only an explicit release or reassignment (both recorded)."
  sdo_test: "Test plans, results and defects. `plan` writes test cases (binding them to requirement ids is recommended), `record` records results (even passes need evidence), `defect` files or updates a defect (severity/status). Open blocker-level defects block the verification gate."
  sdo_review: "Review records: record the verdict (pass / changes requested / reject) and the findings. **A reviewer may not be the author** — independence is checked mechanically, not left to good intentions."
  sdo_deliver: "Delivery package: artifact manifest (with sha256), acceptance matrix (one row per must-have requirement), rollback point, and an explicit statement that prototype content is excluded. It stops at a deployable artifact; release and operations are explicitly out of scope."
  sdo_cost: "Cost report: tokens consumed; a monetary amount appears only when the user has supplied unit prices, and it is labelled an **estimate** everywhere. The budget is optional — with no total it reports consumption only (no remaining amount, no percentage, no threshold alerts); exceeding the budget **never stops anything**, it only asks a human to top up, waive, or narrow scope. Model read-only."
  sdo_gate: "Gate engine (the process is data, every gate is evaluated criterion by criterion, never guessed). `check` evaluates and records; `advance` moves on only when every exit gate of the current phase passed or was waived; `waive` waives explicitly with a trace. **An unimplemented checker always fails** — \"cannot check\" must never mean \"passes\"."
  sdo_feasibility: "TELOS feasibility assessment (technical / economic / legal / operational / schedule) plus a Go/No-go verdict with reasons and PoC suggestions for the high risks. Together with the risk register it forms the evidence for the feasibility gate."
  sdo_risk: "Risk register. `log` records a risk (level / probability / impact / mitigation / owner, optionally with an origin such as a red-team issue — an origin converts the issue into a risk); `update` changes status or fills in mitigation and owner; `list`; `conclude` writes the per-round risk conclusion for spiral projects."
  sdo_design: "Architecture work, guarded by two gates: the requirements baseline gate has passed and the plan review is complete (SDO drives plan mode itself; with no interactive review channel it **blocks by design** and records the block instead of writing). `create` adds or updates design elements across the five views; `contract` records a cross-component contract (timeout / retry / idempotency); `view` shows the current views."
  sdo_adr: "Architecture decision records. Every record must state the **rejected alternatives** (with their costs) and the **accepted consequences** — a decision that is only a conclusion is refused by the architecture gate. `record` | `list` | `supersede` (the new record supersedes the old one; the old record gains a pointer and is never rewritten)."
  sdo_quality: "Quality attribute scenarios and lightweight ATAM. A scenario states stimulus → response plus a **measurable** metric (indicator + condition + threshold); without numbers it is not a scenario. `evaluate` turns the ATAM outcome into three lists (risks / sensitivities / trade-offs)."
  sdo_trace: "Trace graph (`.sdo/trace/links.jsonl`) — change impact analysis, orphan detection and coverage all read it. `link` creates edges (requirement → design / task / test case, batching supported), `query` shows coverage and orphans, `report` renders the traceability report."
  sdo_lang: "Show or switch the UI language (tool and command descriptions, the status block, gate wording). `action=show` reports the current language and pack coverage; `action=set lang=en` switches immediately (**effective for this process** until restart)."


  kUiConfirmed: "UI plan confirmed: style + per-page columns + per-page layout"
  kUiMissing: "UI plan not confirmed: {p1}"
  kUiMissingStale: "The content of these UI items changed, so their confirmation lapsed ({p1})"
  kUiRemedy: "Fill in style/columns/layout with `sdo_design action=create kind=ui ui=<UI view JSON>`, then confirm each with `action=confirm target=...` (`action=view kind=ui` is read-only)."
  kUiNa: "No requirement in this project declares a UI/screen surface, so the UI criteria do not apply"

  # Increment 2: method packs (structured / object-oriented / agile-evolutionary)
  kMethodSelectedOk: "Design method chosen: {p1}"
  kMethodSelectedNone: "Explicit none: this project produces no design-method artefacts"
  kMethodSelectedRemedy: "Answer the method question with sdo_design action=answer; the value must be structured / oo / evolutionary / none (multi-select with +)"
  kMethodProductsRemedy: "Fill the missing method artefacts with sdo_design action=artifact (kind: dictionary / dfd / erd / classes / sequences / layers / debt / reversibility / increments)"
  kMethodConsistencyOk: "The selected method artefacts are mutually consistent"
  kMethodConsistencyFail: "The method artefacts are inconsistent: {p1}"
  kMethodConsistencyRemedy: "Fix the dangling references (data item / type / entity / element) or the dependency direction in the method artefacts"

  # 2026-09-30: design-applicability declaration + gate signature + phase rollback (spec 6 / 7)
  kApplicabilityMissing: "Applicability not declared: this project has no design-applicability declaration (.sdo/design/applicability.yml)"
  kApplicabilityRemedy: "In the requirements phase draft one with sdo_requirement action=applicability (focus + every view explicitly present or absent + reasons + required artefacts), then have the user sign it with action=applicability-confirm"
  kApplicabilityIncomplete: "The design-applicability declaration is incomplete: {p1}"
  kApplicabilityOk: "The design-applicability declaration is complete: {p1} views to produce, {p2} declared out of scope. {p3}"
  kNoPresentView: "The declaration lists no view to produce"
  kNoPresentViewRemedy: "Declare at least one view to produce (content for the affected part is enough) and exclude the rest explicitly via viewsAbsent + a reason"
  kViewsNa: "{p1} declared view(s) are complete; the remaining views are not applicable by declaration: {p2}"
  kArtifactsNa: "The declaration requires no extra non-view artefacts (invariants / mapping / diffVerify are all optional here)"
  kArtifactsOk: "The declared required artefacts are complete: {p1}"
  kArtifactsMissing: "Declared required artefacts are missing: {p1}"
  kArtifactsRemedy: "Fill them in with sdo_design action=artifact kind=…: every invariant needs a verify method, both sides of a mapping must be non-empty, and the differential strategy needs a baseline source"
  kSigned: "G3 is signed by the user: {p1} (quoted basis: {p2}; channel: {p3})"
  kSignedRemedy: "Waiting for the user's signature confirmation: either have the user state it in the session (sdo_gate action=sign gate=G3 quote=<their words>) or use the human question channel (channel=question); a signature without quoted text is invalid"
  kRollbackNone: "No phase rollback has happened yet"
  kRollbackNoReasonAt: "A rollback event has no reason: {p1} -> {p2}"
  kRollbackRemedy: "A rollback must state the requirement gap found, and may only follow a legal rollback edge declared by the process"
  kRollbackIllegal: "Illegal rollback edge: {p1} -> {p2} (legal targets: {p3})"
  kRollbackOk: "Phase rollback is properly recorded: {p1} -> {p2}"
  kPrototypeNa: "This process involves no prototype and no prototype directory exists, so the timebox criterion does not apply"
  kPrototypeBackfilledNa: "This process involves no prototype and no prototype directory exists, so the prototype-backfill criterion does not apply"
  kDesignDocUnproven: '`docs/DESIGN.md` has no machine-readable rendered-from-source marker (`<!-- source: ... @ journal seq N -->`) — it cannot be proven to come from the current source of truth; re-render it with `sdo_design action=render`'
  kDesignDocStale: '`docs/DESIGN.md` is stale: it was rendered at source event #{p1}, and event #{p2} ({p3}) changed the source afterwards — re-render before judging'
  kDesignDocSeqOutOfRange: 'The render marker in `docs/DESIGN.md` cannot be trusted: it claims seq #{p1} while the source only reaches #{p2} — a future seq would keep a stale document green forever, so this fails; re-render with `sdo_design action=render`'
  kDesignDocBodyMismatch: 'The body of `docs/DESIGN.md` differs from re-rendering the current source of truth at the seq recorded in its marker (it was hand-edited, or rendered by an older build): the content is detached from the source, so re-render it'
  kDesignDocLangUnknown: "The render marker in `docs/DESIGN.md` declares a language that is not shipped with the plugin: {p1} (available: {p2}) — the marker is wrong or lying; re-render it"
  kDesignDocNoRenderEvent: "The render marker claims rendering at source event #{p1}, but the journal holds no `design/rendered` event for it — the claim that it was rendered cannot be proven; re-render with `sdo_design action=render`"
  kCheckerThrew: "The criterion checker threw (usually a hand-edited source of truth, e.g. broken YAML indentation or type): {p1}"
  kCheckerThrewRemedy: 'Fix the source file named in the error (`.sdo/**`) and re-judge; this criterion is recorded as failed under the rule "an unreadable check must not count as a pass", while the other criteria still evaluate'
  kViewConflict: 'The declaration contradicts itself: {p1} appears in both viewsPresent and viewsAbsent'
  kViewConflictRemedy: 'A view can only be one of the two: put it in `viewsPresent` if you build it, or in `viewsAbsent` with a reason if you do not, then re-draft'
  kViewsUiDeclaredButAbsent: 'The declaration says the UI view (ui) is present, but the source of truth holds no UI evidence (requirement kind=ui or project surfaces) — C-27 is therefore not applicable'
  kViewsUiRemedy: 'Either add the UI source (`sdo_requirement action=update kind=ui` or `sdo_project action=update surfaces=[...]`) or drop `ui` from viewsPresent'
  kViewsUiAbsentButReal: 'The declaration marks the UI view (ui) as NOT produced, but the source of truth says this project does have a UI: {p1} — the declaration contradicts the source (moving ui into viewsAbsent does not exempt UI confirmation C-27)'
  kViewsUiAbsentButRealRemedy: 'Pick one, then re-draft the declaration and have the user sign it: if you do build the UI, put `ui` back into `viewsPresent` and complete the UI confirmations (`sdo_ui`); if you truly have no UI, remove the UI evidence from the source (`sdo_requirement action=update` for UI-kind requirements, or `sdo_project action=update surfaces=[]`)'
  kOrphanConfirmations: '{p1} confirmation stamp(s) no longer match any item (deleted / renamed / lost requires) and are no longer required: {p2}'
  kDorCriterionUnknown: 'Internal inconsistency: the DoR verdict has no criterion {p1} (process data and implementation diverge; treated as failed)'
  kGateUnknownRemedy: 'Check that the plugin and the process data versions match (`sdo_status` / `/sdo-board` list the gates the current process declares; use `sdo_gate action=check gate=<gate id>` to see one gate criterion by criterion)'
  kArtifactsAbsentNoWhy: 'Declared-as-absent non-view artefacts lack a reason: {p1} (same rule as absent views: every entry needs a why)'
  kTraceBadLines: 'The trace file `trace/links.jsonl` has {p1} unreadable line(s) (out of {p2} non-empty lines, {p3} parsed) — coverage and orphan checks are computed on this **incomplete graph**, so it cannot count as a pass'
  kTraceBadLinesRemedy: 'Open `.sdo/trace/links.jsonl` and fix or delete those malformed JSON lines (each line must be a JSON object with from/to/kind), or re-create the missing edges after checking with `sdo_design action=view`'
  kAcIdsUnique: "Acceptance-criterion ids are globally unique ({p1} ids)"
  kAcIdsDuplicated: "Acceptance-criterion ids are duplicated across requirements: {p1} — AC ids are the trace key of the delivery acceptance matrix, and duplicates make it mismatch"
  kAcIdsDuplicatedRemedy: "Renumber or remove the duplicates: `sdo_requirement action=update id=REQ-xxx acceptance=[...] acceptanceMode=replace` (replaces the whole list; ids must be globally unique — without acceptanceMode it only appends), or hand-edit `acceptance[].id` in `.sdo/requirements/REQ-xxx.yml` and judge again"
  kRollbackEvidenceNote: '(legality source: each rollback event carries its own `legalAtThatTime`; historical rollbacks are not re-judged against the current process data, so this criterion is only as strong as the claim that events cannot be forged)'
  kArtifactsBoth: 'These non-view artefacts are declared both required and not-required: {p1} — one declaration cannot contradict itself'
  kArtifactsAbsentOk: 'The non-view artefacts are all explicitly out of scope, each with a reason: {p1}'
  kJournalTruncated: "Source of truth is incomplete: `journal.jsonl` line {p1} is corrupt and was truncated to the last consistent prefix — this criterion **cannot be judged** (it is not a failure)."
  kJournalTruncatedRemedy: "Fix `journal.jsonl` at the line above first (or preserve the content before that line and rebuild the source), then judge again; until then any conclusion about render events / signature invalidation / red-team records / rollback traces cannot be trusted."
  kMethodDocMissing: "Package {p1} is **missing its human-review document**: write `{p2}` (a document for people, authored by the model) with the header `{p4}` (the basis is computed from the current ledger; it is {p3} right now), and mention every entry id of that package."
  kMethodDocStale: "`{p1}` is **inconsistent with the ledger**: the header declares basis {p2} while the current ledger yields {p3} — the ledger changed and the document was not regenerated; update the document and its basis."
  kMethodDocNoHeader: "(missing document header)"
  kMethodDocIncomplete: "`{p1}` does not cover these entry ids: {p2} — the document must walk through the artifacts so a human reviewer can see the actual content, not just a summary."
  kMethodDocRemedy: "Write one `docs/METHOD-<package>.md` per selected package (author the content yourself: tables, diagrams and prose are all fine — e.g. class and sequence diagrams for OO, DFD and ERD for structured, mapping tables for porting). The header must be `<!-- method-doc: package=<package>; basis=<basis> -->`, using the basis that `sdo_design action=method` reports."

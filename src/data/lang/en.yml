uiSkills:
  roleCardsDescription: "Use when executing or dispatching a task card in an SDO (dsh-software-dev-office) project: load the role card for that role — goal, input/output contracts, definition of done, prohibitions and question templates."
  roleCardsWhenToUse: "Claiming or dispatching a task card in an SDO project"
  roleCardsRegistered: "Role-card index skill registered"
  skillsMissing: "The host has no skills service mounted: role cards still ship with the package but cannot be loaded on demand (mounting is not blocked)"
skillBody:
  title: "SDO role cards ({p1}, loaded on demand)"
  intro1: "You are a **single dispatch run** inside an SDO (dsh-software-dev-office) project: a role is not a session, and the flow officer imposes your tool surface (see the table)."
  intro2: "Read the card for your role **in full** first, then follow it — a card is discipline, not optional advice."
  tableHead: "| Role | Name | When to use (mask rationale) | Card |"
  tableRow: "| `{p1}` | {p2} | {p3} | `{p4}` |"
  sectionsNote: "Every card contains: goal / input contract / output contract / definition of done (DoD) / prohibitions / question and review templates."
  maskHead: "Hard constraint (tool mask): tools outside the DECLARED face must not be called (on a real machine the host may not hide them for you; out-of-mask calls are rejected by the tools/pre-execute hook):"
  maskLine: "- `{p1}`: allow = {p2}; deny = {p3}"
  dirLine: "Card directory: `{p1}`"
  protocolHead: "Execution protocol (same source as the dispatch prompt; follow it when stuck):"
  protocol1: "1) `sdo_task action=claim` (with `expectedRevision`; on a CAS conflict re-read the card);"
  protocol2: "2) change only files inside your write scope;"
  protocol3: "3) `sdo_task action=done` requires evidence items (command / workspace-changes / artifact) — claiming completion is not completion;"
  protocol4: "4) when stuck use `sdo_task action=block note=…` — do not push through and do not silently change scope."

uiConstruction:
  c01: "{p1} has the wrong shape (expected a top-level profile:)"
  c02: "Unknown method package: {p1}"
  c03: "scope must be `all` or an array of task ids"
  c04: "`derivedFrom` must not be empty (a model-chosen profile must leave its basis)"
  c05: "Every `exempt` entry needs task / check / why (why must not be empty)"
  c06: "{p1}: requirement {p2} not found"
  c07: "{p1}: {p2} has kind {p3}, not the declared {p4}"
  c08: "{p1}: the ledger actually holds {p2} contracts"
  c09: "{p1}: unknown scale (expected {p2})"
  c10: "{p1}: this project scale is {p2}"
  c11: "`derivedFrom` needs at least one machine-checkable basis (`reqKind=...` / `contractCount=...` / `scale=...`)"
  c12: "{p1} is not frozen yet (no `design/confirmed` record) - freeze the contract before claiming the implementation"
  c13: "{p1} was only frozen at seq {p2}, after this claim (seq {p3}) - freeze the contract before claiming the implementation"
  c14: "{p1} has no test case"
  c15: "the cases for {p1} ({p2}) have no fail-then-pass ordering evidence (pass-only does not count as TDD)"
  c16: "{p1} needs mutation evidence at critical scale ({p2} holds no record with killed >= 1)"
  c17: "{p1} has no contract test record ({p2})"
  c18: "`packages` must not be empty (pick at least one method package)"
  c19: "{p1} in `scope` does not exist"
  c20: "exemption {p1}/{p2} must state a reason"
  c21: "exemption references an unknown check code: {p1} (the tool layer accepts OUTER codes only; `tdd-env-changed`/`tdd-harness-changed`/`tdd-artifact-unchanged` are engine-internal criterion names and are NOT usable as exemption keys — use `tdd-red-green-missing` to exempt the whole red-green group)"
  c22: "the construction profile is broken (inspect the file by hand): {p1}"
  c23: "no construction method packages decided yet: have the flow officer run `sdo_plan action=profile` (model-chosen, with a checkable basis)"
  c24: "choosing no method packages requires a stated reason (criteria go N/A, but the reason must be recorded)"
  c25: "deliverable is missing `task`"
  c26: "mutation record is missing `tool`"
  c27: "`killed` must be a non-negative number"
  c28: "`survived` must be a non-negative number"
  c29: "contract test is missing `contract`"
  c30: "contract {p1} does not exist in the ledger"
  c31: "contract test needs `tool` or `cmd`"
  c32: "these result files have **no matching journal event** (hand-written or forged - not accepted): {p1}"
  c33: "TDD red->green is not the same experiment: case {p1} went red under env \"{p2}\" and green under \"{p3}\" — both runs must share one environment (a changed environment means changed conditions)."
  c34: "TDD red->green **changed the assertion surface**: case {p1} had harness fingerprint \"{p2}\" when red and \"{p3}\" when green — this cannot distinguish \"the implementation turned green\" from \"the assertions were edited until they passed\". Record the same fingerprint for both (`sdo_test action=record harness=…`)."
  c35: "TDD red->green left the **artifact unchanged**: case {p1} binds the same sha256 ({p2}) in both runs — code did not move yet the case turned green; check whether the assertions were edited or the artifact swapped."


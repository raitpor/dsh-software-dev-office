  kShapeNote: "Hand-written YAML shape notes (a list or mapping slot was written in another shape): {p1}"
  kShapeNoteFailed: "Shape notes could not be read (this criterion was still judged): {p1}"
  kDesignDocPhaseUnknown: "The render marker in `docs/DESIGN.md` declares a phase that the current process does not define: {p1} (available: {p2}) — the phase only lives in the marker and never in the body, so it must be validated explicitly; re-render the document"
  kDesignDocPhaseForged: "`docs/DESIGN.md` declares phase **{p1}**, but the `design/rendered` event of this render records **{p2}** — the two disagree (the header and the event do not come from the same render, or the document was edited)."

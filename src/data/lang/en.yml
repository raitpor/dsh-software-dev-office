  kWorkReviewMissing: "These medium/large cards (size >= medium) are done without a passing review: {p1} (record one with sdo_review action=record verdict=pass; the reviewer must not be the card owner)"
  kWorkReviewRemedy: "Record a pass review for every medium/large card (author != reviewer); if a card truly needs no review, split it down to small/trivial"
  kWorkReviewOk: "All {p1} medium/large cards have a passing review"

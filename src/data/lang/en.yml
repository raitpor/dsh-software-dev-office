  kIssueDisposeAlreadyClosed: 'Note: the gate had already judged it closed by **derivation** (related questions all answered) while the file still said `status: open` (two sources of truth contradicting each other) — this only catches the **file** up; the gate verdict does not change.'
  kTestUnjournaled: 'WARNING: {p1} test result(s) have **no `test/recorded` event** ({p2}) — the journal cannot show they were produced by a run, so they cannot count as evidence (hand-written files and later rewrites surface here)'
  kTaskAdminOnly: 'REJECTED: this action belongs to the flow officer / cockpit (drop, reassign, card edits); the claiming session may `release`/`update` its own card — on a real machine a subagent dropping an unfinished card turned C-40 green (D6)'
  kWriteScopeViolation: "BLOCKED (out of scope): role {p1} is working card whose write scopes are {p3}, but this call writes {p2} — card write scopes are a **mechanical constraint**, not a suggestion: move the change inside the scopes, or have the flow officer update the card and re-claim. The ledger (`.sdo/`), derived docs (`docs/`) and tests (`test/`) are a shared face, not bound by card scopes."
  kWriteScopeNoClaim: "BLOCKED (out of scope): role {p1} writes {p2} but has **no live claimed card** — claim first with `sdo_task action=claim` (the card decides the write scopes); before that only the shared face (`.sdo/`, `docs/`, `test/`) may be written."
  kWriteScopeEmptyScope: "BLOCKED (out of scope): the card claimed by role {p1} has **no write scopes** (`writeScopes` empty; C-31 flags it) so nothing outside the shared face can be authorised. Have the flow officer fill in the card scopes and re-claim."
  kReviewEmptyPass: "❌ A review must carry findings — an empty `pass` review turns C-42 green (D9); a `changes-requested`/`reject` review with no findings has nothing to verify or act on (2026-10-08: findings are adopted only after per-finding verification). If there really is nothing, write it explicitly (e.g. \"checked every item, no findings\")."

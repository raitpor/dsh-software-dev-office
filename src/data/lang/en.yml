  kApplicabilityArtifactsAbsent: "JSON text whose items are kind + why: every non-view artefact declared NOT to be produced must carry a reason (same rule as viewsAbsent; a missing why makes C-2C red)."
  kApplicabilityBasis: "The basis binding the user's signature to the declaration (the user's own words or the chosen option label; mandatory for action=applicability-confirm)."

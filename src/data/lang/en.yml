  kIssueDisposeNeedDisposition: 'REJECTED: `action=dispose` needs `disposition`: `risk` (converted into a risk) or `requirement` (settled back into requirements). **Nothing was written.**'
  kIssueDisposeMissing: 'REJECTED: issue `{p1}` not found (see `sdo_design action=issues`). **Nothing was written.**'
  kIssueDisposed: 'OK: issue {p1} disposed -> {p2} (written into the issue file and traced by `issue/closed`). {p3}'

  kReviewRehashNoId: "❌ rehash needs the review id: `sdo_review action=rehash id=REV-001`"
  kReviewRehashed: "✅ {p1} now carries a content fingerprint ({p2}...) — from now on edits to the verdict or finding text are judged `tampered`; changes made before the seal remain unverifiable"

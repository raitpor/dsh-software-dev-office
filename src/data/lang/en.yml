  kGateChannel: "Signature channel (action=sign): statement = the user stated it explicitly in the session (then quote with their own words is mandatory); question = go through the human question channel so the user picks in person (the tool asks; the quote never passes through the model)."
  kGateQuote: "The user's own words from the session (mandatory for channel=statement; it is checked against the session transcript and rejected on mismatch)."
  kGateTurn: "Session turn reference (optional; recorded in the journal for audit)."
  kGateRollbackTo: "Target phase for a rollback (action=rollback); only edges declared in the process data rollback section are allowed."
  kApplicabilityFocus: "The focus of the design-applicability declaration: this project's nature and design emphasis (free text drafted by the model)."
  kApplicabilityPresent: "JSON text of views this project will produce; values context/component/runtime/data/deployment (content for the affected part is enough)."

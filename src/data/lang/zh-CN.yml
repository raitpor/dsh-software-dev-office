  fileTooShort: 太短（少于 6 字）
  fileTooLong: 太长（超过 200 字）
  fileNotQuestion: 未以问号结尾
  fileNoKeyword: 未引用需求原文用词（要出现需求里**连续 4 个汉字以上**的片段，或原文里 ≥3 字符的数字/英文词；「系统」「功能」这类两字通用词不算引用原文）

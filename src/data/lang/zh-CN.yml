  acceptance: 验收矩阵（JSON 数组）
  rollbackPoint: 回滚点
  reviewer: 评审者
  verdict: 结论
  findings: 发现项（JSON 数组）
  steps: 步骤（JSON 数组）
  expected: 期望结果
  caseId: 用例 id
  defectId: 缺陷 id
  requirement: 需求 id
  reporter: 报告人
  designId: 设计元素 id
  dependsOn: 依赖的元素名（逗号分隔）
  elementKind: 元素类型
  responsibility: 职责
  summary: 摘要
  schema: 契约正文（结构/字段/示例）
  contractKind: 契约类型
  timeout: 超时语义
  retry: 重试语义
  idempotency: 幂等语义
  alternatives: 备选方案（JSON 数组，含各自利弊）

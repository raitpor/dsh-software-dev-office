# 原则：**对外呈现一律用中文**；内部标识（门禁 id、阶段 id、状态码、角色码）保持不变，
# 因为它们要进出 journal、命令参数与追溯图。显示时用本表把标识翻成中文。
# 用法：`t('gate.G0')` → 「立项门禁」；`gateIdOf('立项门禁')` → `G0`（命令参数也收中文）。

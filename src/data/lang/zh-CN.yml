# `sdo_release` 的**工具描述**（`TASK-183` 的 DoD 逐字要求：进 `sdo.release` 这一段）。
# 兄弟工具的描述都在 `tool.sdo_*`（那段是**20 个**已登记工具的历史位置）；本工具的键按卡片点名走 `sdo.release`，
# 两处不是同一份文案，因此**只此一处**：工具定义读的就是它（`src/domain/releaseTool.ts` 的 `t('sdo.release')`）。
sdo:
  release: "发布计划工具面：把「本版做哪些」写成可签字的集合（`.sdo/releases/<id>.yml`）。动作：show（只读：当前版、scope/nonScope 计数、冻结状态、判据侧读数）/ propose（按台账现算一份提案，**只回显不落盘**，并预演 freeze / defer 两条判据）/ sign（走问答通道让用户签字，`frozenBy=human` 与 `frozenAtSeq` 以 human 出处落进 journal —— 与 `sdo_gate sign channel=question` 同一机制）/ write（**仅当已有待用人签**时落盘；`frozenAtSeq` 由工具在落盘时取真实事件序号，**不接受调用方填**）/ change（改**已冻结**的集合：必须带 `reason` + `approvedBy=human` + 被改动的 id 列表；落 `release/changed` 事件并重新落盘，撞上已冻结集合却不走它就会被 `C-75` 判红）。硬规则：`propose`/`show` 一个字节都不写；没有对应人签的 `write` / `change` 一律拒绝；驾驶舱与模型不得代签（`ADR-022` 裁决①）。"

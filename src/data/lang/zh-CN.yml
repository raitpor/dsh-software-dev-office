tool:
  sdo_init: 初始化 SDO 项目（在当前工作目录建 `.sdo/` 台账）。**关键参数缺一不可**：项目名/开发流程/规模档/干系人——缺了不会拿默认值立项，而是先给出一张问询单让你去确认。
  sdo_status: 查看项目状态：当前阶段、待判定门禁、需求与问题计数、最近一次门禁判定、派生投影是否需要重建。只读。
  sdo_project: 维护项目台账（第 19 个工具）：范围与**非目标**、干系人、术语表、成功度量、开发流程与规模。`update` 只写显式给出的字段（术语表按 key 合并）；`show` 打印当前台账。
  sdo_requirement: 需求工程。`capture` 捕获需求（自动做八维歧义评分）、`grill` 审讯提问（每题带选项与代价）、`answer` 记录答复（可标为假设）、`update` 修改或补 Given/When/Then 验收标准、`change` 基线后走变更控制（含影响分析与决策；变更内容可以是字段，也可以是 `acceptance` 验收标准）、`list`、`baseline` 冻结基线并判定需求基线门禁。
  sdo_redteam: 需求红队：对抗式攻击需求集，产出缺陷式议题（每条必须回到需求或转为风险）。`off`/`on` 切换**本会话**红队开关（留痕）；`status` 查看。
  sdo_render: 把真源渲染成文档（派生视图，带真源序号与"请勿手改"标注）。目前支持需求规格 `srs`。
  sdo_plan: 任务拆分与派发。`decompose` 双通道拆卡（结构通道按追溯图、模型通道吃建议）并跑六条机械校验；`iteration` 开一个迭代；`next` 按容量预算挑出可派发的卡并产出派发请求。
  sdo_task: 任务卡与协同协议：认领走比较交换（版本号对不上即冲突）、只有 owner 能回报、**完成必须带证据**、卡住要说明原因；失联的 owner **不会自动释放**，只能显式释放或改派（都留痕）。
  sdo_test: 测试计划、结果与缺陷。`plan` 写用例（建议绑定需求 id）、`update` **更正既有用例**（标题/步骤/期望/需求/类型；改需求会**同步追溯边**并在回执里逐条列出撤销与新建）、`record` 记录结果（通过也要带证据）、`defect` 登记或更新缺陷（严重度/状态）。未关闭的阻塞级缺陷会拦住验证门禁。
  sdo_review: 评审记录：记录结论（通过/要求修改/驳回）与发现项；**评审者不得是作者**（独立性是机械校验的，不靠自觉）。
  sdo_hash: "现算一个产物的**完整 sha256**（+ mtime + 字节数）—— **只读纯查询**，不写任何台账、不落事件。为什么需要它：评审者的掩码 `deny` 里有 `bash`（跑不了任何命令），而唯一产出产物哈希的 `sdo_test` 也被 deny ⇒ 没有它，评审者只能看 done 回执里的**截断**指纹，无法自证「我核的是不是这份产物」。"
  sdo_deliver: 交付包：产物清单（含 sha256）、验收矩阵（每条必须级需求一行）、回滚点，并声明不含原型内容。只到"可部署产物"，发布与运维明确不做。
  sdo_cost: 成本报告：已消耗 token；只有在用户填了单价时才给金额，且**处处标注"估算"**。预算可选——没填总额就只报消耗（不给剩余/百分比、不触发阈值）；超预算**不会自动停**，只提醒人去选追加/豁免/收敛。模型只读。
  sdo_gate: 门禁引擎（流程即数据，门禁逐条判定，绝不臆测）。`check` 判定并留痕；`advance` 仅在当前阶段出口门禁全部通过或已豁免时推进；`waive` 显式豁免并留痕。**未实现的检查器一律判失败**——绝不允许"查不到就算过"。
  sdo_feasibility: TELOS 可行性评估（技术/经济/法律/运营/进度）+ 可行结论与理由 + 针对高风险项的 PoC 建议。它和风险登记一起构成可行性门禁的证据。
  sdo_risk: 风险登记。`log` 登记（等级/概率/影响/缓解/责任人，可带来源，例如某条红队议题——带来源即视为把议题转成了风险）；`update` 更新状态或补缓解与责任人；`list`；`conclude` 写螺旋流程每圈的风险结论。
  sdo_design: 架构工作，受两道门约束：需求基线门禁已过 + 计划评审已完成（SDO 主动驱动 plan mode；没有交互评审通道时**按设计阻塞**并留痕，不落笔）。`create` 在五视图里新增/更新设计元素；`contract` 记录跨组件契约（含超时/重试/幂等）；`view` 查看当前视图。
  sdo_adr: 架构决策记录。每条必须给出**被否决的备选方案**（含各自代价）与**接受的后果**——只有结论的决策会被架构门禁拒绝。`record`｜`list`｜`supersede`（新记录取代旧记录，旧记录只加指针、内容不改写）。
  sdo_quality: 质量属性场景与轻量 ATAM。场景要写刺激→响应 + **可测的度量**（指标+条件+阈值），没有数字的不算场景；`evaluate` 把 ATAM 结论落成三张清单（风险点/敏感点/权衡点）。
  sdo_trace: 追溯图（`.sdo/trace/links.jsonl`）——变更影响分析、孤儿检测与覆盖率都读它。`link` 建边（需求→设计/任务/用例等，支持批量）、`query` 看覆盖率与孤儿、`report` 渲染追溯报告文档。
  sdo_lang: "查看或切换界面语言（工具/命令描述、状态块、门禁文案）。`action=show` 看当前语言与语言包覆盖率；`action=set lang=en` 立即切换（**进程内生效**，重启前一直有效）。"
param:
  mutationExpected: "声明**本卡计划做几条变异自证**（DEF-027）：给了就与台账 `readMutations` 的**实到条数逐条对账**（多了少了都判红并点名，含「声明 0 条却有记录」）；**不给 = 不声明**，判据维持旧口径（只要求 `killed ≥ 1`）。例：`mutationExpected=3`。为什么是数字字段而不是写进 DoD 散文：判据必须语言无关，从句子里抠数字换种写法就失效。"
  designBasisSource: 'action=confirm：`user`（用户本人确认，默认）或 `proxy`（**代盖** —— 授权人不是执行人时必须写 proxy，事件里才可辨）'
  signQuote: "用户**针对本次签署/豁免**的原话（逐字引用；`action=sign` 与 `action=waive` 共用这个参数）。`sign`：必须能在本次会话的用户发言里找到，且**不许复用**上次失效之前的旧话（R-27，会被拒）；要重新取得就走 `channel=question`。`waive`：可选 —— 给了就核对（核不过则拒绝），不给也放行但台账记 `approverChecked: none`、回执明说批准人没有用户原话依据。 `approverChecked` 的真实取值是 `none`（没给依据）/ `session`（与**人类出处**的发言核对过）/ `role-only`（宿主消息没有出处信息，只按 `user` 角色判定 —— 弱口径）/ `unavailable`（拿不到会话历史）—— 四者都如实落台账。"
  runsRequired: "action=package：本次交付**要求**覆盖的真机运行目标（逗号分隔，如 'server,client'）。缺哪个目标的通过记录就把所有 pass 行降级为 unverified"
  designConfirmBasis: 'action=confirm 的**用户授权原话**（优先于 note/reason；旧实现忽略它，事件里只留下工具自己的文案）'
  planFreshChild: 'action=next：**强制新起**子代理（不复用空闲者）。真机教训：单一子代理被复用 19 轮直至上下文耗尽'
  redteamAction: "attack＝按题库攻击；propose＝请模型针对需求生成质询；file＝回填模型生成的质询（插件校验）；on／off＝开关红队模式；status＝查看当前模式。"
  requirementId: 回填时针对的需求 id（REQ-xxx）。
  questions: JSON 文本，形如 `[{"text":"…？","dimension":"data","options":[{"label":"…","cost":"…"}],"recommendation":"…"}]`（仅 action=file 使用）。**带上 `options` 的题才能用 `pickedOption` 答复**；不带选项的题只能用自由文本 `answer`。
  issueId: 要处置的议题 id（仅 action=dispose）：REQ-ISSUE-001。
  disposition: 议题去向：`risk`（转为风险）或 `requirement`（回到需求）。仅 action=dispose。
  disposeNote: 处置理由 —— 写进议题文件与 `issue/closed` 事件。仅 action=dispose。
  id: 标识（如 REQ-001 / TASK-001 / Q-0001）
  name: 名称
  owner: 责任人 / 执行者
  approver: 批准人
  approvedBy: 人类签字人（基线门禁需要）
  evidence: "done 的证据 JSON 文本。形状：[{\"kind\":\"command\",\"detail\":\"＜项目的测试命令＞（＜通过数＞ passed）\",\"exitCode\":0}, {\"kind\":\"artifact\",\"detail\":\"＜产物路径＞ sha256=＜64 位十六进制＞\"}, {\"kind\":\"workspace-changes\",\"detail\":\"session-…@42\"}]。校验：种类要覆盖卡的 evidenceRequired；artifact 的路径必须真实存在（给了哈希就复算）；command 的 exitCode 是**独立字段** —— 写进 detail 文本不会被读到，要它生效就单独给字段。"
  title: 标题
  impact: 影响
  mitigation: 缓解措施
  origin: 来源（例如红队议题 id；带来源即视为把议题转为风险）
  rationale: 理由说明
  note: 备注 / 说明
  notes: 备注
  limit: 条数上限
  listStatus: "`sdo_task action=list`：按状态收窄（`ready` / `in-progress` / `blocked` / `done` / `dropped`，**精确匹配**）。不给 = 不筛。与 `id` 同给时 `id` 优先走详情档"
  listRole: "`sdo_task action=list`：按角色收窄（`developer` / `tester` / `reviewer` / `office`，**精确匹配**）。不给 = 不筛"
  listLimit: "`sdo_task action=list`：显示上限（缺省 50；`0` = 显式要全量）。被截断时回执**最后一行**印「另有 N 张未显示」——不会静默省略"
  decision: 决策
  decidedBy: 决策人
  requirements: 需求 id（JSON 文本）
  suggestions: "卡片建议。**两种形态都收**（DEF-065 起 schema 声明的是 `string | array` 联合）：①**JSON 文本**（推荐，形如 `[{\"title\":\"卡名\"}]`）；②**数组**（数组原样到达也会被接受并由插件归一）。每项的字段名必须与任务卡一致：`title` / `dod`（字符串数组）/ `writeScopes`（字符串数组，**不是** `scope`）/ `evidenceRequired` / `blockedBy`（**支持 `[「*」]` 这种写法 = 排在所有其它卡之后**，用于最终构建/全量验证这类需要独占窗口的卡） / `role` / `size` / `requirements`。**写错键名不报错**，会静默落成空值（真机教训：写成 `scope` ⇒ `writeScopes: []`）。未给 `writeScopes` 时按「设计元素职责里的『写范围：…』→ config.yml 的 plan.scopeTemplate → `src/<slug>/` 占位」依次推导。**两类失败要分清**：①**宿主校验拒**（工具 schema 校验阶段，插件收不到这次调用）⇒ 文案形如 `invalid arguments: \"suggestions\" must be a string`；DEF-065 前数组恒走这条，现在联合声明已放行数组。②**插件解析拒**（文本形态写坏）⇒ 文案是「形状不对」或「值被打断」，并明说本次未写入。**不要把①误报成②**（英文 `param.suggestions` 同义）。"
  goal: 目标
  expectedRevision: 你读到的版本号（比较交换，用于认领）
  actor: 操作人
  rollbackPoint: 回滚点
  reviewer: 评审者
  findings: "record / append：发现项 —— **两种形态都收**（DEF-065 起 schema 声明的是 `string | array` 联合）：①**JSON 文本**（推荐，形如 `[\"第一条\",\"第二条\"]`）；②**数组**（数组原样到达也收，插件归一后再解析）。**两类失败要分清**：①**宿主校验拒**（工具 schema 校验阶段，插件收不到这次调用）⇒ 文案形如 `invalid arguments: \"findings\" must be a string` —— DEF-065 前这就是数组恒被拒的那条路，现在联合声明已放行数组；②**插件解析拒**（文本写坏，由 `jsonOr` 报）——**形状不对**（不是合法 JSON：值不是数组、多了逗号、字符串里有裸换行）⇒ 报「形状」并说明本次未写入；**值被打断**（值里出现**未转义的 ASCII 引号**，本字段最常见 —— 引用标识符/命令/路径几乎必然用到引号）⇒ 报错会**点名第 N 个字符**。**推荐写法**：值里一律用**中文引号**（`「」`/`“”`）或按 JSON 规则转义，**不要**用 ASCII 引号；一条消息里**并发多个长 JSON 参数**也容易触发中断，建议逐个发。**`append` 专用**：追加到**既有**评审时，值只放**新增**的发现项（已封印的原正文不必重发，也不许夹带改写 —— 追加路径没有 `verdict` 入参，原结论改不了）；空数组 / 全空白会被拒且**不改动任何文件**。"
  # —— verify（核实评审发现）：评审结果是主张，要由实现方逐条核实才能采纳 ——
  hashPath: "要现算指纹的产物路径（**工作区相对路径**）。越出工作区 / 不存在 / 不是文件都会被可读拒绝 —— 这条入口是只读查询，不接受通配、也不写台账。"
  reviewId: 评审 id（`REV-*`）：`rehash` = 要给哪条老格式评审补记内容指纹；`append` = 追加到哪条既有评审；verification 面 = 要核实哪条评审
  originalIndex: "`append`：本次补录的是**原文的第几条**（1 起，指本次第一条发现项在来源评审里的条号）。与 `originalTotal` **必须成对**：声明后重号/跳号/超界会被可读拒绝，不声明则维持旧口径（存量不追溯）"
  originalTotal: "`append`：**原文（来源评审）共几条**。与 `originalIndex` 成对，用来判超界（补到最后一条之外会被拒）"
  reviewIndex: 第几条发现（**从 1 起**，与回执里印的「第 N 条」一致）
  reviewOutcome: '核实结论：reproduced（照发现能复现）/ refuted（复现不了，给反证）'
  reviewProof: 复现的命令与结果、或反驳的反证（必填，空口核实不算）
  steps: 步骤（JSON 文本）
  expected: 期望结果
  caseId: 用例 id
  defectId: 缺陷 id
  fullSuite: 'record：这条结论**自称覆盖全量**（DEF-033 第三面）；有未冻结完成的卡时，交付门禁（C-67）要有一条晚于最后一次这类 `done` 的 `pass` + 全量结论。缺省 = 不是全量结论。'
  reviewDefectId: 'record：这条评审**点名的缺陷**（DEF-076；一个或多个 id，可给 JSON 文本或真数组）。每个 id 必须真实存在（否则可读拒绝、零写盘）—— 缺陷的「已评审」由此有结构化真源，门禁 `defects.fixed-reviewed`（C-66）据此判「先评审、后测试」。'
  requirement: 需求 id
  dependsOn: 依赖的元素名（逗号分隔）
  elementKind: 元素类型
  responsibility: 职责
  summary: 摘要
  schema: 契约正文（结构/字段/示例）
  contractRequires: "**本契约挂在哪条需求上**（DEF-056）：填需求 id（`REQ-*`）：可以是 JSON **文本**（如 `[\"REQ-001\"]`），或逗号分隔的多个 id。判据 `contract-test-missing` 用它判「这张卡有没有契约对象」——**不写就等于该契约对所有卡都不算对象**（那些卡的判据会走 N/A）。写不存在的号会被当场拒绝（零写盘）。"
  timeout: 超时语义
  retry: 重试语义
  idempotency: 幂等语义
  consequences: "后果（**JSON 文本**）：数组元素可以是字符串，也可以是 `{\"item\":\"后果\",\"mitigation\":\"缓解措施\"}`（`mitigation` 可选、会被保留并渲染）。**写进去就一定读得出来**（读写同一形状）"
  supersedes: 取代哪条记录
  stimulus: 刺激（什么事件触发）
  response: 响应（系统怎么做）
  targets: 关联的设计元素 id（逗号分隔）
  risks: 风险点（JSON 文本）
  sensitivities: 敏感点（JSON 文本）
  tradeoffs: 权衡点（JSON 文本）
  by: 执行人
  from: 起点 id
  to: 终点 id
  scopeIn: 范围（做什么，逗号分隔）
  scopeOut: 非目标（明确不做什么，逗号分隔）
  metricsSuccess: 成功度量（可测，逗号分隔）
  stakeholders: 干系人（逗号分隔）
  rebuild: 是否强制从真源重建派生投影
  answer: 答复内容
  assume: 是否记为假设（未获用户确认时用）
  quick: 是否只问最关键的问题
  target: 渲染目标
  taskId: 任务卡 id
  sourceStakeholder: "来源干系人 id（如 STK-01）。与 sourceRaw 至少给一个，否则**拒绝落账**（需求必须有来源）。"
  sourceRaw: "用户原话/文档原文（**需求必须有来源**）。与 sourceStakeholder 至少给一个。"
  pickedOption: "用户选中的选项序号（从 0 起）。**下标绑的是本插件存的 `options` 表**：把题目转述给用户时若重排或改写了选项，必须按**你转述前的那份插件选项表**给下标，并同时保留 `answer` 里用户的原话（台账会把下标与标签各记一份，便于事后核对）。"
  ids: "需求 id 列表，逗号分隔（默认：全部需求）。"
  context: "补充上下文（自由文本，会写入留痕）。"
  producer: "被依赖方：填它的 dependsOn 原串（通常是被依赖设计元素的 id 或 name）。consumer 依赖 producer。"
  consumer: "依赖方：填**依赖别人的那个设计元素的 name**（组件视图里发起依赖的一方）。"
  reason: "理由（留痕用；drop 卡时必须说明为什么作废）。；`block`/`done` 也接受它（等价于 `note`，DEF-068：旧实现只读 note，理由会被记成「未说明」）"
  lang: "语言包名（如 `zh-CN` / `en`）"
  langAction: "show＝查看当前语言与翻译覆盖；set＝切换（配 lang=<zh-CN|en>）。"


  surfaces: "项目级界面面（web / desktop / mobile，逗号分隔）：声明含界面时界面视图才进入门禁（§2.1）。"
  designKind: "视图：'context' | 'component' | 'runtime' | 'data' | 'deployment'（create 必填）；kind=ui 表示界面视图（此时必须同时给 ui=<界面视图 JSON>）。"
  designMethod: "grill：你基于需求给出的**设计方法推荐**（结构化/面向对象/敏捷-演进式/组合）——必须给出，用户据此选择。"
  designRationale: "grill：推荐理由（结合需求说明为什么推荐它）。"
  designRound: "grill：本轮最多新增几个问题（不填 = 一次把缺口问全）。"
  designQuestionId: "answer：设计问题 id（Q-xxxx）。"
  designChoice: "answer：选项下标（0 基）或选项原文；也可以是用户自定义答复。"
  designAssume: "answer：用户明确说过「按你的建议办」时才为 true——未授权不得自问自答。"
  designTarget: "confirm：元素/契约/界面条目 id（DES-xxx / CT-xxx / UI-xxx / SCR-xxx:columns / SCR-xxx:layout）。"
  designState: "issues：'open'（默认，只看未决）| 'all'（含已回答）。"
  designUi: "create kind=ui：界面视图 JSON，形如 {style:{source:minimal,tokens:{},rationale:…},screens:[…]}；source 取值 follow-host / minimal / enterprise / custom；screens[].layout 可写 stack:vertical|horizontal 显式声明区域堆叠方向（缺省 vertical，线框图会注明方向来源）。"
  designArtifactKind: "artifact：方法产物种类（dictionary｜dfd｜erd｜classes｜sequences｜layers｜debt｜reversibility｜increments｜mapping｜invariants｜diffVerify）。"
  designArtifactData: "artifact：产物正文 JSON。公共字段只有 summary / requires，正文必须放在**本 kind 的字段**下（放错字段会被回执点名，且不会落半成品）。**列表字段是整列覆盖**：提交 `dictionary` / `sequences` 等字段就替换**整列**（只补 `summary` / `requires` 时不碰它们）；覆盖前会先留一份快照，回执里写明覆盖了几条。各 kind 形状：dictionary→{dictionary:[{name,type,source,sink,validation}]}；dfd→{levels:[{level,name,flows,processes}]}；erd→{entities:[{name,identifier}],relations:[{name,from,to,cardinality}]}；classes→{types:[{name,kind,layer,responsibility,collaborators}]}（叶子类型显式写 leaf:true）；sequences→{sequences:[{name,participants,messages}]}（需求来源写 requires:[REQ-xxx] 或 requirement:REQ-xxx，写入时归一）；layers→{rules:{layers,assignments,allowed}}；debt→{debts:[…]}；reversibility→{decisions:[…]}；increments→{increments:[…]}；mapping→{mappings:[…]}；invariants→{invariants:[…]}；diffVerify→{diffVerify:{…}}。"
  designPuml: "render：可选。给 true 走默认落点 .sdo/design/ui.puml，也可给工作区内的相对路径；只写 .puml 骨架源码（本仓库没有渲染器，不出图）。"
redteam:
  fileOptionCount: "　[选项 {p1}]"
  proposeHeader: 红队质询提案（由**模型**针对具体需求生成；插件只负责校验）
  proposeInstruction: 请为下面每条需求生成 {count} 条攻击性质询，要求：① **必须引用该需求陈述的原文片段**（连续 4 个汉字以上，或原文里 ≥3 字符的数字/英文词；「系统」「功能」这类两字通用词不算）；② 每条以问号结尾，6~200 字；③ 不得与已存在的问题重复；④ 给出维度（目标/用户/场景/数据/接口/约束/验收/边界）。

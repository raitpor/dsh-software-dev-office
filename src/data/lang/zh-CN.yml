  appendOriginalPair: "❌ 条号声明**不完整**（{p1}）：`originalIndex`（本次补的是原文第几条）与 `originalTotal`（原文共几条）**必须成对**给 —— 只给一个等于「声明了一半」，重号/跳号/超界都无从判定（宁可不写，也不要写半个）"
  appendOriginalInvalid: "❌ 条号声明不是**正整数**（{p1}）：`originalIndex`={p2}、`originalTotal`={p3} —— 两者都必须是 1 起的整数（原文第几条 / 原文共几条）"
  appendOriginalOverflow: "❌ 条号**超界**（{p1}）：本次从原第 {p2} 条起补 {p3} 条 ⇒ 末条是第 {p4} 条，而声明原文只有 {p5} 条。核对两处：① 原文实际共几条；② 本次要补的是哪几条"
  appendOriginalOverlapBody: "❌ 条号**重号**（{p1}）：本次声明的区间落在**正文已经占住**的原第 {p2} 条里 —— 正文本身就是原文的前几条，再补一遍会让同一条原文在记录里出现两次（读者看到两条互相矛盾的正文）。要补就补**正文之后**的条号"
  appendOriginalOverlap: "❌ 条号**重号**（{p1}）：本次声明的区间与**已补录过**的原第 {p2} 条**重叠** —— 同一条原文被补了两遍，读者会看到两条互相矛盾的正文（真机 REV-047/REV-053 就是这个形状）。要么改成本次真正要补的那几条，要么先撤回已补的那次"
  appendOriginalGap: "❌ 条号**跳号**（{p1}）：已补录到原第 {p2} 条，本次却从原第 {p3} 条开始 ⇒ 中间那几条被跳过（残缺会读成「原文只有这些」）。先把缺的那几条补上，或把本次改成从原第 {p2} 条起"

uiSignature:
  weak: '⚠️ **弱签字**（陈述面 `channel=command`）：只入账、**不冻结门禁** —— 门禁 C7 只认问答通道（`channel=question`，原话由宿主回传、不经过模型）的签字'
  journalOnly: '⚠️ 但真源 journal 里有 {p1} 条 gate/signed 事件 —— 签字台账文件被删或被改写（这不是「从来没签过」，是不一致，D8）'
  noEvent: '⚠️ 但真源 journal 里找不到与这条签字（{p1} {p2}）对应的 gate/signed 事件 —— 手写/绕过工具写入（D8）'
  basisRequired: "签字必须带引用文本：请给出用户原话（channel=statement）或走人机关口问答（channel=question）"
  basisReplayed: "⛔ 这条依据不可用：它是**上次失效之前**的老话（首次用于 #{p2}，而 {p1} 在 #{p3} 已失效）。签字的意义是**人此刻为这份内容背书** —— 请让用户**重新表态**，或改用 `channel=question`（由工具当场问用户，引用不经过模型）。"
  missing: "门禁 {p1} 还没有用户签字"
  unquoted: "门禁 {p1} 的签字（{p2}）没有引用文本，视为无效"
  stale: "门禁 {p1} 的签字已失效：签字之后真源发生变更（序号 {p2} 的 {p3}）"
  staleMany: "门禁 {p1} 的签字已失效：签字之后真源发生了变更（{p2}）"
  staleMore: "（共 {p1} 条，此处列前 3 条）"
  staleUnclassified: "；其中**未分类**的事件类型按保守口径视为真源变更：{p1}（黑名单口径：不在中性表里即失效）"
  valid: "门禁 {p1} 已由用户签字：{p2}（依据：{p3}）"
  validUnchecked: "门禁 {p1} 已由用户签字：{p2}（依据：{p3}）—— ⚠️ 本次**未经过会话历史核对**（宿主没提供会话记录），只保证了引用非空；需要强审计的项目应重新走一次带核对的签字"
  channelCommand: "会话明确表述（强）"
  channelQuestion: "人机关口问答（弱）"
  invalidatingEvents: "；失效事件集合（门禁 {p1}）：{p2} —— 签字之后出现其中任一事件即失效（按 journal 序号判定）"
  invalidatingEventsBlacklist: "；失效口径（门禁 {p1}）：**黑名单** —— 除纯读/渲染/计量/记账类事件（如 `design/rendered`、`gate/result`、`phase/*`、`task/*`、`cost/*`）外，任何真源写入都让签字失效（按 journal 序号判定）。反着列是因为白名单漏一个真源就留一个洞"

  truncated: "无法判定：`journal.jsonl` 第 {p1} 行损坏（已截断到最后一致前缀），因此**无法确认门禁 {p2} 的签字之后是否发生过失效事件**；先修好该行再判定（现在既不报「有效」也不报「已失效」）。"
  answerChannelRequired: "⛔ 拒收这次作答（**一个字节都没有写进台账**）：破坏性决策的批准只认**人机关口问答通道**（`channel=question`，选项标签由宿主回传、不经过模型）。这次的来源是「{p1}」。"
  answerDecisionUnknown: "⛔ 拒收这次作答（**一个字节都没有写进台账**）：`{p1}` 不是三档之一。合法值只有 {p2} —— 三档各自可落账，但认不出的取值不许冒充任何一档。"
  answerLabelRequired: "⛔ 拒收这次作答（**一个字节都没有写进台账**）：缺少**引用依据**（用户所选选项的原文）。没有原文的作答无法回证「他到底选了什么」。"
  answerPayloadRequired: "⛔ 拒收这次作答（**一个字节都没有写进台账**）：缺少**被签内容的 sha256**（收到「{p1}」）。没有它，事后答不出「他批准的是哪一份内容」。"
  answerProvenanceRequired: "⛔ 拒收这次作答（**一个字节都没有写进台账**）：缺少**来源凭据**（收到「{p1}」，本插件只承认 {p2}）。只有选项标签、没有「用户本人在界面上点的」这项凭据，判不出这是真实作答还是预填默认 / 自动作答 / 复用旧答。"
  answerFreeText: "⛔ 拒收这次作答（**一个字节都没有写进台账**）：「{p1}」是**自由文本**作答 —— **自由文本不具备签字效力**（它可以当备注）。破坏性决策只认三档选项：批准 / 拒绝 / 要求修改。"
  answerRemedies: "三条可执行出路：① **重试** —— 在 Web GUI 里让工具当场重新发问（`sdo_gate action=sign channel=question`）；② **先在界面呈现再签** —— 把待批内容（审核单全文）摆出来、取其 sha256 之后重新提问；③ **人工核** —— 由人工核对一遍，核完仍须在问答通道里点三档之一（陈述面只记弱签字，不冻结门禁）。"

  qFailureConsequence: "重试语义不明会出现重复扣款/重复落单这类事故"
  failureIdempotent: "全部写操作幂等（可安全重试）"
  failureIdempotentCost: "要引入幂等键与去重存储"
  failureRetry: "只读重试，写操作人工确认"
  failureRetryCost: "失败时需人工介入，恢复慢"
  failureManual: "不自动重试（失败即报错）"
  failureManualCost: "瞬时故障也会直接暴露给用户"
  failureRecommend: "全部写操作幂等（可安全重试）"
  failureRecommendWhy: "幂等是自动重试的前提；先花小成本加幂等键，能省掉后面大量人工兜底"
  # 错误与可观测
  qErrorText: "错误处理口径是什么（快速失败 / 容忍继续 / 兜底降级）？"
  qErrorWhy: "错误口径决定用户看到什么，也决定日志与告警的判定条件"
  qErrorConsequence: "口径不明会导致同一个错误在不同路径上处理方式相反"
  errorFailFast: "快速失败（宁可不可用，不可不可信）"
  errorFailFastCost: "单点故障会对用户可见"
  errorTolerant: "容忍继续（跳过坏数据并告警）"
  errorTolerantCost: "要防止坏数据静默扩散"
  errorSilent: "兜底降级（返回默认值继续）"
  errorSilentCost: "可能掩盖真实故障"
  errorRecommend: "快速失败（宁可不可用，不可不可信）"
  errorRecommendWhy: "先保证结果可信；降级路径等有了明确的监控与判定条件再加，否则故障会被静默吞掉"
  qObserveText: "日志/指标/告警的要求是什么？"

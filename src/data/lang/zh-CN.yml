  requirementId: 回填时针对的需求 id（REQ-xxx）。
  questions: JSON 数组，形如 `[{"text":"…？","dimension":"data"}]`（仅 action=file 使用）。
  action: 动作
  id: 标识（如 REQ-001 / TASK-001 / Q-0001）
  name: 名称
  owner: 责任人 / 执行者
  gate: 门禁（可用中文名，如"立项门禁"，也可用标识 G0）
  approver: 批准人
  approvedBy: 人类签字人（基线门禁需要）
  evidence: 证据：命令输出摘要 / 产物路径 / 改动引用（JSON 数组）
  status: 状态
  severity: 严重度
  kind: 类型
  title: 标题
  statement: 需求陈述（要写成可判定的"指标+条件+阈值"）
  priority: 优先级
  level: 等级
  probability: 概率
  impact: 影响
  mitigation: 缓解措施
  origin: 来源（例如红队议题 id；带来源即视为把议题转为风险）
  conclusion: 结论
  rationale: 理由说明
  note: 备注 / 说明
  notes: 备注
  limit: 条数上限
  decision: 决策
  decidedBy: 决策人
  requirements: 需求 id（JSON 数组）
  suggestions: 卡片建议（JSON 数组）
  goal: 目标
  backend: 派发后端偏好
  expectedRevision: 你读到的版本号（比较交换，用于认领）

# SDO 界面文案（i18n 语言包，zh-CN）
#
# 原则：**对外呈现一律用中文**；内部标识（门禁 id、阶段 id、状态码、角色码）保持不变，
# 因为它们要进出 journal、命令参数与追溯图。显示时用本表把标识翻成中文。
# 用法：`t('gate.G0')` → 「立项门禁」；`gateIdOf('立项门禁')` → `G0`（命令参数也收中文）。
locale: zh-CN
gate:
  G0: 立项门禁
  G1: 可行性门禁
  G2: 需求基线门禁
  G3: 架构门禁
  G4: 详细设计与计划门禁
  G5: 开发完成门禁
  G6: 验证门禁
  G7: 交付门禁
  GP: 原型验收门禁
  GI: 迭代完成门禁
  GR: 风险象限评审
  # 迭代/阶段别名（有些流程用阶段名当门禁语境）
  tasksAllDone: "任务卡 {n} 张全部完成且有证据"
  tasksDroppedNote: "（另有 {n} 张已显式放弃，不计入完成率）"
  tasksMissingEvidence: "完成但无证据：{ids}"
  tasksMissingEvidenceRemedy: "补证据（`sdo_task action=done` 必须带 evidence）"
  tasksIncomplete: "未完成：{list}"
  tasksAllDoneRemedy: "补救：把剩余卡做完（`sdo_task action=done` 且带 evidence），或**显式放弃**（`sdo_task action=drop reason=…`）——已放弃的卡不再计入完成率。"

uiSkills:
  roleCardsDescription: "SDO（dsh-software-dev-office）项目里执行或派发任务卡时用：按角色加载对应角色卡 —— 目标、输入/输出契约、完成定义（DoD）、禁止事项与提问模板。"
  roleCardsWhenToUse: "在 SDO 项目里认领/执行任务卡、或把卡派发给某个角色时"
  roleCardsRegistered: "角色卡索引技能已注册"
  skillsMissing: "宿主没有装配 skills 服务：角色卡照常随包交付，但不能按需加载（不阻塞装配）"
skillBody:
  title: "SDO 角色卡（{p1} 张，按需加载）"
  intro1: "你是 SDO（dsh-software-dev-office）项目里的**一次派发运行**：角色不是会话，工具面由流程官施加（见下表）。"
  intro2: "先按你的角色读对应卡片**全文**，再按卡片执行 —— 卡片是纪律，不是可选建议。"
  tableHead: "| 角色 | 名称 | 什么时候用（掩码理由） | 卡片 |"
  tableRow: "| `{p1}` | {p2} | {p3} | `{p4}` |"
  sectionsNote: "每张卡片都含：目标 / 输入契约 / 输出契约 / 完成定义（DoD）/ 禁止事项 / 提问与评审模板。"
  maskHead: "硬约束（工具掩码）：**声明**之外的工具不得调用（真机上宿主未必替你隐藏，越界调用由 `tools/pre-execute` 钩子拒绝）："
  maskLine: "- `{p1}`：allow = {p2}；deny = {p3}"
  dirLine: "卡片目录：`{p1}`"
  protocolHead: "执行协议（与派发提示同源，卡住时照此办理）："
  protocol1: "1) `sdo_task action=claim`（带 `expectedRevision`，CAS 冲突就重新读卡）；"
  protocol2: "2) 只改写范围内的文件；"
  protocol3: "3) `sdo_task action=done` 时必须附证据条目（command / workspace-changes / artifact），空口完成不算完成；"
  protocol4: "4) 做不下去就 `sdo_task action=block note=…` —— 不要硬撑，也不要静默改范围。"

uiConstruction:
  c01: "{p1} 结构不对（应有顶层 profile:）"
  c02: "未知的方法包：{p1}"
  c03: "scope 必须是 `all` 或任务 id 数组"
  c04: "`derivedFrom` 不能为空（模型自选必须留下依据）"
  c05: "`exempt` 的每一项都要有 task / check / why（why 不得为空）"
  c06: "{p1}：找不到需求 {p2}"
  c07: "{p1}：{p2} 的类型是 {p3}，与声明的 {p4} 不符"
  c08: "{p1}：台账里实际是 {p2} 个契约"
  c09: "{p1}：未知档位（应为 {p2}）"
  c10: "{p1}：当前项目的档位是 {p2}"
  c11: "`derivedFrom` 里至少要有一条能被机械核对的依据（`reqKind=…` / `contractCount=…` / `scale=…`）"
  c12: "{p1} 还没有冻结（没有 `design/confirmed` 记录）——先冻结契约再认领实现"
  c13: "{p1} 在第 {p2} 条才冻结，晚于本次认领（第 {p3} 条）——先冻结契约再认领实现"
  c14: "{p1} 没有对应用例"
  c15: "{p1} 的用例（{p2}）没有「先 fail 后 pass」的时序证据（只记 pass 不算 TDD）"
  c16: "{p1} 在 critical 档位下需要变异自证（{p2} 里没有 killed ≥ 1 的记录）"
  c17: "{p1} 没有契约测试记录（{p2}）"
  c18: "`packages` 不能为空（至少要选一个方法包）"
  c19: "`scope` 里的 {p1} 不存在"
  c20: "豁免 {p1}/{p2} 必须写明理由"
  c21: "豁免引用了未知的检查码：{p1}（工具层只认**外层码**；`tdd-env-changed`/`tdd-harness-changed`/`tdd-artifact-unchanged` 是引擎内层判据名，**不可用作豁免键** —— 要豁免整组红绿判据请用 `tdd-red-green-missing`）"
  c22: "实现阶段方法包的 profile 坏了（要人工看一眼）：{p1}"
  c23: "还没决定实现阶段方法包：先让流程官跑 `sdo_plan action=profile`（模型自选，依据要能被核对）"
  c24: "显式不选任何方法包时必须写明理由（判据会 N/A，但理由要留下）"
  c25: "交付物缺 `task`（要写清是哪张卡）"
  c26: "变异记录缺 `tool`（用什么跑的）"
  c27: "`killed` 必须是非负数字"
  c28: "`survived` 必须是非负数字"
  c29: "契约测试缺 `contract`"
  c30: "契约 {p1} 在台账里不存在"
  c31: "契约测试要给出 `tool` 或 `cmd`（怎么跑的）"
  c32: "这些结果文件在台账里**没有对应事件**（可能是手写/伪造，判据不认）：{p1}"
  c33: "TDD 红→绿不是同一次实验：用例 {p1} 的红灯环境是「{p2}」、绿灯环境是「{p3}」—— 两次必须同环境（换环境 = 换了实验条件，先证结论仍成立再收工）。"
  c34: "TDD 红→绿**换了断言面**：用例 {p1} 红灯的断言面指纹是「{p2}」、绿灯是「{p3}」—— 这无法区分「实现由红转绿」与「把断言改到能过」。同一次实验必须同指纹（`sdo_test action=record harness=…`）。"
  c35: "TDD 红→绿之间**产物没变**：用例 {p1} 红绿两次绑定的产物（{p2}）是同一个 sha256 —— 代码没动却转绿，可疑；请核实是「断言被改」还是「换了被检产物」并更正证据。"


  C-59: "测试总结报告已由用户签字：报告必须由当前真源渲染（渲染稿 + journal 渲染登记），且签字台账里有本门的、绑定**当前报告内容指纹**的签字；四态 —— ① 报告不在盘 / 不是当前真源的渲染 ⇒ 判红（先 `sdo_render target=report`）；② 报告在但本门没有签字 ⇒ 判红并给可执行修法（`sdo_gate action=sign gate=\"<门禁>\"`，默认 channel=question）；③ 有签字但报告或真源在签字之后被改（指纹变了 / 渲染稿被手改）⇒ 判红并点名「签字已失效，需重签」；④ 报告在 + 存在当前指纹的签字 ⇒ 绿，回执给出报告路径 / 内容指纹 / 签字时刻"
  C-28: "设计方法已选择（未回答/空/非法即失败；显式 none 也通过，产物判据转 N/A）"

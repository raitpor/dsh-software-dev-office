  target: 渲染目标
  taskId: 任务卡 id
  sourceStakeholder: "来源干系人 id（如 STK-01）。与 sourceRaw 至少给一个，否则**拒绝落账**（需求必须有来源）。"
  sourceRaw: "用户原话/文档原文（**需求必须有来源**）。与 sourceStakeholder 至少给一个。"
  pickedOption: "用户选中的选项序号（从 0 起）。"
  ids: "需求 id 列表，逗号分隔（默认：全部需求）。"
  context: "补充上下文（自由文本，会写入留痕）。"
  producer: "被依赖方：填它的 dependsOn 原串（通常是被依赖设计元素的 id 或 name）。consumer 依赖 producer。"
  consumer: "依赖方：填**依赖别人的那个设计元素的 name**（组件视图里发起依赖的一方）。"
  reason: "理由（留痕用；drop 卡时必须说明为什么作废）。"
  lang: "语言包名（如 `zh-CN` / `en`）"
  langAction: "'show'（查看当前）｜ 'set'（切换）"


redteam:
  proposeHeader: 红队质询提案（由**模型**针对具体需求生成；插件只负责校验）
  proposeInstruction: 请为下面每条需求生成 {count} 条攻击性质询，要求：① **必须出现该需求陈述里的词**（原文用词，不要另起说法）；② 每条以问号结尾，6~200 字；③ 不得与已存在的问题重复；④ 给出维度（目标/用户/场景/数据/接口/约束/验收/边界）。
  proposeMustQuote: 校验规则：不引用原文用词、不以问号结尾、与已有问题重复的，插件会**拒绝**并告出原因。
  proposeStatement: 需求原文
  proposeWeak: 该需求尚未澄清的维度
  proposeWeakNone: （八维均已澄清——请从"实现与运行风险"角度提问）
  proposeNone: 还没有需求可做红队质询：先用 sdo_requirement action=capture 登记需求。
  proposeCallHint: 生成后调用 sdo_redteam action=file requirementId=<REQ-xxx> questions=<JSON 数组> 回填，插件校验通过才落库。
  fileNoRequirement: 找不到需求 {id}
  fileNeedId: 回填红队质询需要 requirementId。
  fileAccepted: 已登记 {n} 条红队质询（模型生成，已通过"引用原文"校验）
  fileRejected: 被拒绝 {n} 条
  fileAskHint: 下一步：用提问工具把这些质询**问用户**，再 sdo_requirement action=answer 记录答案。
  fileConsequence: 若这条例需求真的如此脆弱，会在开发/评审阶段暴露为返工或线上故障。
  fileEmpty: 内容为空
  fileTooShort: 太短（少于 6 字）
  fileTooLong: 太长（超过 200 字）
  fileNotQuestion: 未以问号结尾
  fileNoKeyword: 未引用需求原文用词（请用需求里出现的词）
  fileDuplicate: 与已有问题重复


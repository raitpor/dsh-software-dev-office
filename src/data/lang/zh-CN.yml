  qObserveConsequence: "没有可观测性，故障只能靠用户投诉发现"
  observeLog: "结构化日志 + 错误上报"
  observeLogCost: "查问题要先手工聚合"
  observeMetrics: "日志 + 指标（关键路径埋点）"
  observeMetricsCost: "要定义指标口径与看板"
  observeFull: "日志 + 指标 + 告警阈值（可自愈）"
  observeFullCost: "告警规则要持续调，否则产生噪声"
  observeRecommend: "日志 + 指标（关键路径埋点）"
  observeRecommendWhy: "关键路径埋点能覆盖绝大多数定位需要，成本远低于完整告警体系；告警阈值等有真实故障样本后再定"
  # 演进
  qEvolveText: "允许破坏性变更吗？兼容窗口多长？"

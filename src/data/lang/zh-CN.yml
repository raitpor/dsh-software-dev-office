  supersedes: 取代哪条记录
  attribute: 质量属性
  stimulus: 刺激（什么事件触发）
  response: 响应（系统怎么做）
  measure: 可测度量（指标+条件+阈值）
  targets: 关联的设计元素 id（逗号分隔）
  risks: 风险点（JSON 数组）

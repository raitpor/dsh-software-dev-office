  qEvolveConsequence: "兼容口径不清会突然打断既有调用方"
  evolveNoBreak: "不允许破坏性变更（永久兼容）"
  evolveNoBreakCost: "旧版本要长期维护"
  evolveWindow: "允许，但有兼容窗口（如 1 个版本）"
  evolveWindowCost: "要维护双版本与下线流程"
  evolveFree: "允许随时改（内部系统无外部消费方）"
  evolveFreeCost: "变更影响面要自己评估"
  evolveRecommend: "允许，但有兼容窗口（如 1 个版本）"
  evolveRecommendWhy: "给出明确的兼容窗口，既保留演进空间，又让消费方有迁移时间；永久兼容会让设计越来越重"
  qDebtText: "技术债容忍度是什么？"

  sdo-grill: "就需求生成下一批审讯问题（≤4 问，带选项与代价）；`--id=REQ-001` 限定需求，`--quick` 只问 P0"
  sdo-answer: "回答问题：`--id=Q-0001 --answer=… [--option=0] [--dimensions={'goal':2,…}]`；用户不知道时用 `--assume`（采用默认建议并记为假设）；答案正文本身不改分，要移动评分必须给 `--dimensions`"
  sdo-redteam: "红队：`--attack` 生成质询问题；`--off` / `--on` 切换本会话红队（写 redteam/mode 留痕）；默认显示状态"
  sdo-gate: "门禁：`--gate=G0` 判定并留痕；`--sign --gate=G2 --quote=用户原话 [--channel=statement|question] [--approved-by=…] [--turn=…]` 记录用户签字（**无引用一律拒绝**）；`--rollback --to=阶段 --reason=…` 阶段回退；`--waive --gate=G2 --reason=… --approver=…` 显式豁免（留痕，不静默跳过）"
  sdo-next: "推进到下一阶段（当前阶段的出口门禁必须已通过或已豁免；否则给出缺口与补救）"
  sdo-budget: "成本与预算：`--show`（默认）｜ `--set --total=100 [--currency=CNY] [--tiers=50,80,100]`｜ `--decide --choice=add-budget|waive|narrow-scope [--note=…]`（决策留痕，**不会自动停**；旧写法 `total=100` / `choice=…` 仍被接受）"
  sdo-render: "把 `.sdo/` 真源渲染成人类文档（M1：`--target=srs` → docs/SRS.md）"
  sdo-lang: "查看或切换界面语言：`/sdo-lang`（查看）｜ `/sdo-lang en`（切到英文，进程内生效）"
  sdo-design-grill: "就设计生成下一批交互问题（含方法论选择题）；`--method=… --rationale=…` 给出模型推荐与理由，`--round=N` 限定本轮新增数量"
  sdo-design-answer: "回答设计问题：`--id=Q-0001 --choice=0|选项原文 [--note=…]`；用户授权按建议办时用 `--assume`"
  sdo-design-confirm: "确认一个关键条目：`--target=DES-001|CT-001|ui:UI-001:style|SCR-001:columns|SCR-001:layout [--note=…]`；条目清单见 `/sdo-design-issues`"
  sdo-design-issues: "列出设计问题与**必须确认但尚未确认**的关键条目；`--state=all` 连已答复/已关闭的一起列出"
  sdo-design-render: "渲染设计文档到 docs/DESIGN.md（只读台账、只写文档），并回报路径与字节数"

uiTools:
  k1: "JSON object of domain terms, e.g. {\"差异\":\"同一笔业务在两侧系统的不一致记录\"} (merged into the existing glossary)."
  k2: "The requirement statement — what must be true (\"系统须…\")."
  k3: "记为假设时必须为 true：表示**用户授权**按你的建议处理（未授权会被拒绝）"
  k4: "门禁名（中文名或内部编号都行，例如「可行性门禁（G1）」「需求基线门禁（G2）」「架构门禁（G3）」「交付门禁（G7）」；"
  k5: "原型/敏捷/螺旋流程另有「原型验收门禁（GP）」「迭代完成门禁（GI）」「风险象限评审（GR）」）。"
  k6: "对用户讲述时请用中文名，不要只说编号。"
  k7: "JSON 文本：[{\"dimension\":\"technical\",\"verdict\":\"可行\",\"rationale\":\"…\"}, …]; dimensions are technical/economic/legal/operational/schedule."
  k8: "JSON 文本：PoC / validation suggestions for the risky parts, e.g. [\"用 1 天验证 X 的吞吐上限\"]."
  k9: "Measurable response: metric + condition + threshold, e.g. \"单日 100 万条下 P99 < 500 毫秒\"."

  kGateChannel: "签字来源通道（action=sign）：statement = 用户在会话中明确表述（必须同时给出 quote 用户原话）；question = 走人机关口问答让用户亲自选（工具自己发问，引用不经过模型）。"
  kGateTurn: "会话轮次引用（可选，落 journal 便于审计）。"
  kGateRollbackTo: "阶段回退的目标阶段（action=rollback）；只能沿流程数据 rollback 段声明的合法边。"
  kApplicabilityFocus: "设计适用性声明的 focus：本项目性质与设计重点（自由文本，模型起草，如「旧系统重构：只优化流程与效率，业务逻辑不变」）。"
  kApplicabilityPresent: "JSON 文本：本项目要做的视图，取值 context/component/runtime/data/deployment（受影响部分有内容即可）。"
  kApplicabilityAbsent: "JSON 文本，每项形如 kind + why：不做的视图必须逐条给理由。"
  kApplicabilityArtifacts: "JSON 文本：本次必需的非视图工件，取值 invariants/mapping/diffVerify；未列出的不要求。"
  kApplicabilityArtifactsAbsent: "JSON 文本，每项形如 kind + why：**不做**的非视图工件必须逐条给理由（与 viewsAbsent 同口径，缺 why 即 C-2C 判红）。"
  kApplicabilityBasis: "用户签字绑定声明的依据（用户原话或所选选项原文；action=applicability-confirm 必填）。"

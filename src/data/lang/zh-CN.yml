  sdo-init: "初始化 SDO 项目：`--name=… [--process=waterfall|prototype|agile|spiral] [--scale=trivial|normal|critical] [--stakeholders=…]`"
  sdo-status: "查看 SDO 项目状态（阶段、门禁缺口、需求与开环问题计数）；`--rebuild` 强制从 journal 重建投影"
  sdo-board: "查看 SDO 文本看板；`--expand` 展开明细，`--all` 不受保留窗口限制，`--write` 落盘到 docs/BOARD.md"
  sdo-list: "列出需求（ID／优先级／状态／歧义评分／未决问题数）"
  sdo-grill: "就需求生成下一批审讯问题（≤4 问，带选项与代价）；`--id=REQ-001` 限定需求，`--quick` 只问 P0"
  sdo-answer: "回答问题：`--id=Q-0001 --answer=\"…\" [--option=0]`；用户不知道时用 `--assume`（采用默认建议并记为假设）"
  sdo-redteam: "红队：`--attack` 生成质询问题；`--off` / `--on` 切换本会话红队（写 redteam/mode 留痕）；默认显示状态"
  sdo-gate: "门禁：`--gate=G0` 判定并留痕；`--waive --gate=G2 --reason=… --approver=…` 显式豁免（留痕，不静默跳过）"
  sdo-next: "推进到下一阶段（当前阶段的出口门禁必须已通过或已豁免；否则给出缺口与补救）"
  sdo-budget: "成本与预算：`--show`（默认）｜ `--set total=100 [currency=CNY] [tiers=50,80,100]`｜ `--decide choice=add-budget|waive|narrow-scope [note=…]`（决策留痕，**不会自动停**）"
  sdo-render: "把 `.sdo/` 真源渲染成人类文档（M1：`--target=srs` → docs/SRS.md）"
  sdo-lang: "查看或切换界面语言：`/sdo-lang`（查看）｜ `/sdo-lang en`（切到英文，进程内生效）"

uiTools:
  k1: "JSON object of domain terms, e.g. {\"差异\":\"同一笔业务在两侧系统的不一致记录\"} (merged into the existing glossary)."
  k2: "The requirement statement — what must be true (\"系统须…\")."
  k3: "记为假设时必须为 true：表示**用户授权**按你的建议处理（未授权会被拒绝）"
  k4: "门禁名（中文名或内部编号都行，例如「可行性门禁（G1）」「需求基线门禁（G2）」「架构门禁（G3）」「交付门禁（G7）」；"
  k5: "原型/敏捷/螺旋流程另有「原型验收门禁（GP）」「迭代完成门禁（GI）」「风险象限评审（GR）」）。"
  k6: "对用户讲述时请用中文名，不要只说编号。"
  k7: "JSON array: [{\"dimension\":\"technical\",\"verdict\":\"可行\",\"rationale\":\"…\"}, …]; dimensions are technical/economic/legal/operational/schedule."
  k8: "JSON array of PoC / validation suggestions for the risky parts, e.g. [\"用 1 天验证 X 的吞吐上限\"]."
  k9: "Measurable response: metric + condition + threshold, e.g. \"单日 100 万条下 P99 < 500 毫秒\"."


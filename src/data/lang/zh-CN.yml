  qDebtConsequence: "债务无声累积，后面每加一个功能都更慢"
  debtZero: "零容忍（不做临时实现）"
  debtZeroCost: "前期交付慢"
  debtTracked: "允许，但必须记账并排期偿还"
  debtTrackedCost: "要维护技术债台账"
  debtIgnore: "允许且不记账（先上线）"
  debtIgnoreCost: "债务不可见，后续返工无法预估"
  debtRecommend: "允许，但必须记账并排期偿还"
  debtRecommendWhy: "给出进度弹性，同时让每笔债务有主人和偿还期；不记账的债务等于把返工成本藏起来"

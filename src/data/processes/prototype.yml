# 随包数据：快速原型（设计 §7.2）
#
# 关键纪律：原型代码必须落在 prototype/（物理隔离，Q-05）且标记 throwaway: true，
# **不得进入交付产物**；原型结束后必须把发现回填为需求，否则 G7 拒绝交付。
# 阶段产物分两种：`suggestedArtifacts` 只是**建议**（不入门禁、不校验存在性）；
# 真正可强制的是项目自己的「设计适用性声明」（`applicability`），由 G3 的 C-2C 逐条校验。
id: prototype
name: 快速原型
description: Timebox 探索 → 可运行原型 → 需求确认 → 转入主流程；适合需求不明、UI/交互密集的项目
phases:
  - id: intake
    reviewPayload: [decisions]
    name: 立项
    role: office
    entry: []
    exit: [G0]
    suggestedArtifacts: [VISION.md]
  - id: feasibility
    reviewPayload: [decisions, risks]
    name: 可行性
    role: analyst
    entry: [G0]
    exit: [G1]
    suggestedArtifacts: [FEASIBILITY.md]
  - id: prototype
    reviewPayload: [design, decisions]
    name: 原型
    role: developer
    entry: [G1]
    exit: [GP]
    suggestedArtifacts: [prototype/README.md]
    loop: { tool: sdo_task, action: next, until: "prototype.accepted" }
  - id: requirements
    reviewPayload: [requirements, questions, risks, decisions]
    name: 需求
    role: analyst
    entry: [GP]
    exit: [G2]
    suggestedArtifacts: [SRS.md]
    loop: { tool: sdo_requirement, action: capture, until: "prototype.backfilled" }
  - id: architecture
    reviewPayload: [design, contracts, quality, decisions]
    name: 架构
    role: architect
    entry: [G2]
    exit: [G3]
    suggestedArtifacts: [DESIGN.md, DECISIONS.md, QUALITY.md]
  - id: design-plan
    reviewPayload: [tasks, contracts, design]
    name: 详细设计
    role: architect
    entry: [G3]
    exit: [G4]
    suggestedArtifacts: [PLAN.md, TESTPLAN.md]
  - id: construction
    reviewPayload: [tasks, tests]
    name: 开发
    role: developer
    entry: [G4]
    exit: [G5]
    loop: { tool: sdo_task, action: next, until: "tasks.all_done" }
  - id: verification
    reviewPayload: [tests, defects, tasks]
    name: 验证
    role: tester
    entry: [G5]
    exit: [G6]
    suggestedArtifacts: [TESTREPORT.md]
  - id: delivery
    reviewPayload: [tests, defects, changes]
    name: 交付
    role: delivery
    entry: [G6]
    exit: [G7]
    suggestedArtifacts: [DELIVERY.md]
rollback:
  architecture: [requirements]
  design-plan: [architecture, requirements]
  construction: [design-plan, architecture, requirements]
  verification: [construction, requirements]
  # 终止阶段（交付后重开）：可「重新验证」、可一步「重新设计」，也可按需求变更回到需求阶段（语义 A 的自动回退目标）。
  # 需求变更（`sdo_requirement action=change` 批准）会**强制回退到 requirements**：更新需求 → 重签 G2 → 重走设计过 G3 才能继续开发。
  delivery: [verification, architecture, requirements]
gates:
  - id: G0
    name: 立项门禁
    criteria:
      - { id: C-01, check: "project.scope.in", desc: "范围（in）非空" }
      - { id: C-02, check: "project.scope.out", desc: "非目标（out）非空" }
      - { id: C-03, check: "project.stakeholders", desc: "干系人非空" }
      - { id: C-04, check: "project.metrics", desc: "成功度量非空" }
  - id: G1
    name: 可行性门禁
    criteria:
      - { id: C-05, check: "feasibility.verdict", desc: "TELOS 结论为 Go" }
      - { id: C-06, check: "feasibility.risks", desc: "风险已登记，且 high / blocker 级未关闭风险必须有应对与责任人（mitigation 与 owner 非空）" }
      - { id: C-07, check: "feasibility.poc", desc: "给出 PoC 建议" }
  - id: GP
    name: 原型验收门
    criteria:
      - { id: C-70, check: "prototype.timebox", desc: "原型已产出（prototype/ 非空）且标注 throwaway" }
      - { id: C-71, check: "prototype.backfilled", desc: "原型结论已回填为需求" }
  - id: G2
    name: 需求确认门（DoR）
    criteria:
      - { id: C1-dor-per-requirement, check: "dor.per_requirement", desc: "每条需求满足 §5.2.5" }
      - { id: C2-open-questions, check: "questions.open_p0", desc: "无 P0 未决问题；P1 未决不超过 2 条，且每条都已转风险（风险登记里存在 origin 指向该问题 id 的风险项）" }
      - { id: C3-must-has-ac, check: "dor.must_has_ac", desc: "must 需求有 Given/When/Then" }
      - { id: C4-glossary, check: "project.glossary", desc: "术语表非空" }
      - { id: C5-non-goals, check: "project.scope.out", desc: "非目标已声明" }
      - { id: C6-red-team, check: "redteam.executed", desc: "红队已执行或留痕停用" }
      - { id: C7-signoff, check: "human.signoff", desc: "人类基线签字：以签字台账（gates/signatures.yml）里的 G2 签字为准，`approvedBy` 字符串只是附加信息；必须带用户原话/所选选项原文，无引用视为无效；签字后需求/项目/裁剪/问题/风险/红队真源变更即失效" }
      - { id: C8-red-team-closed, check: "redteam.closed", desc: "红队议题已闭环" }
      - { id: C9-ac-ids-unique, check: "dor.ac_ids_unique", desc: "验收标准编号全局唯一（AC 编号是交付验收矩阵的追溯键，重号即错配）" }
      - { id: C11-acceptance-outline, check: "dor.acceptance_outline", desc: "验收大纲已按每条 must 需求的每条 AC 生成（验收项 + 判定基准），且与当前需求基线一致；需求变更后整份失效，须重新生成并随 G2 重签" }
  - id: G3
    name: 架构门禁
    criteria:
      - { id: C-20, check: "design.views", desc: "声明里要做的视图齐备（五视图非空；声明要做界面视图时须有界面证据）" }
      - { id: C-21, check: "trace.orphans", desc: "设计元素 / 任务卡 / 测试用例都追溯到 ≥1 已基线 REQ（孤儿 = 0）" }
      - { id: C-22, check: "design.adr", desc: "ADR 含备选与后果" }
      - { id: C-23, check: "design.no-open-questions", desc: "开放设计问题 = 0" }
      - { id: C-24, check: "design.confirmed", desc: "关键条目（元素/契约/界面条目）均有用户确认戳" }
      - { id: C-25, check: "design.doc", desc: "docs/DESIGN.md 存在、含 11 个固定章节，且由当前真源渲染（渲染序号不早于真源变更）" }
      - { id: C-27, check: "ui.confirmed", desc: "含 UI 时：风格 + 每页栏目 + 每页布局均已确认（不含 UI 时 N/A）" }
      - { id: C-28, check: "design.method-selected", desc: "设计方法已选择：未回答/空/答案非法即失败；显式 none 也通过（此时方法产物判据为 N/A）" }
      - { id: C-29, check: "design.method-products", desc: "选中方法包的最小必产项齐备（缺任一即失败；未选中的包 N/A + 理由；显式 none 时本判据 N/A）" }
      - { id: C-2F, check: "design.method-docs", desc: "选中方法包时：每包必须有一份人审文档 docs/METHOD-<包>.md，文档头绑定该包产物的内容指纹（台账变更后需重新生成），正文要覆盖该包每个条目 id" }
      - { id: C-2A, check: "design.method-consistency", desc: "方法产物之间一致（数据字典覆盖 DFD 流名、无悬空引用、依赖方向合规）" }
      - { id: C-2B, check: "design.applicability", desc: "设计适用性声明存在且结构完整（focus + 每个视图显式二选一 + absent 带理由）；存量项目缺声明即红" }
      - { id: C-2C, check: "design.artifacts", desc: "声明里要做的非视图工件齐备（不变量每条带 verify / 映射两侧非空 / 差分策略有基线来源）；声明为不做的工件（artifactsAbsent）必须逐条写出理由，缺理由即失败（与 absent 视图同一口径）；两处都没列则 N/A" }
      - { id: C-2G, check: "quality.doc", desc: "质量需求落人读文档并受约束：docs/QUALITY.md 存在且由当前真源渲染、每条质量场景可度量（刺激/响应/度量可核对）；真源为空时必须在设计适用性声明里显式声明不做质量场景/ATAM 并给理由（否则判红）" }
      - { id: C-2D, check: "design.signed", desc: "G3 门禁级用户签字（必须带用户原话或所选选项原文；无引用视为无效；签字后声明 / 需求 / 契约变更即失效）" }
      - { id: C-2E, check: "phase.rollback-recorded", desc: "阶段回退留痕合规（回退必须有 reason，且只能沿流程声明的合法回退边）" }
  - id: G4
    name: 详细设计门禁
    criteria:
      - { id: C-30, check: "design.contracts", desc: "契约齐备" }
      - { id: C-31, check: "plan.tasks", desc: "任务卡齐备" }
      - { id: C-32, check: "plan.testplan", desc: "测试计划覆盖 must REQ" }
      - { id: C-33, check: "construction.profile-decided", desc: "实现阶段方法包已决定（模型自选、依据可核对；显式不选包时 N/A + 理由）" }
  - id: G5
    name: 开发完成门禁
    criteria:
      - { id: C-40, check: "tasks.all_done", desc: "全部任务卡完成" }
      - { id: C-41, check: "trace.coverage", desc: "追溯覆盖率达标" }
      - { id: C-42, check: "review.required", desc: "中大卡（size ≥ medium）在完成前已通过评审" }
      - { id: C-43, check: "construction.packages-satisfied", desc: "范围内已完成卡满足所选方法包（红→绿 / 变异 / 契约测试 / 契约先冻结）" }
      - { id: C-58, check: "trace.defect-links", desc: "缺陷追溯：每条缺陷要么有指向**已基线且未作废**需求的 `req-defect` 边，要么在 `.sdo/defects/*.yml` 里带显式豁免（理由 + 批准人）；否则判红并逐条点名，回执给出可执行修法（补哪条边 / 走哪条豁免）与缺陷追溯覆盖率读数，豁免清单单列；台账读不动判红（fail-closed）" }
      # **DEF-050 / C-63（TASK-072）**：卡上 `fixes` 声明的缺陷必须闭合或**署名放弃**。
      # 挂 G5 的理由：
      #   · G5 是**施工收口**门（"全部任务卡完成且带证据"就是它的 C-40）—— 本判据问的正是
      #     "那张卡说它修好的缺陷，台账认不认"，同一个时刻、同一批对象，不新造挂点；
      #   · 与 C-58（缺陷追溯）同为缺陷台账的判据，但**两个维度**：C-58 管"缺陷有没有回到需求"，
      #     本条管"声明修好了的缺陷闭合了没有"（追溯覆盖率 100% 与闭合状态无关，正是缺陷 DEF-050 的坑）；
      #   · 不放 G6：修复闭合不是"能不能发布"的问题（C-51 已管阻塞级）——
      #     已修未闭合的 major/minor 应当**当场**在施工收口时被逮住，而不是拖到发布前。
      - { id: C-63, check: "details.fixes-closed", desc: "已声明修复的缺陷必须闭合或署名放弃：对每张 status ∈ {done, verified} 的卡，遍历其 `fixes`，每条缺陷必须 ① status ∈ {fixed, closed}，或 ② status === wontfix 且 `waiveReason` 与 `waiveApprovedBy` 去空白后**都非空**（口径同 DEF-038，不新造）；否则判红并**逐条点名**（卡 id + 缺陷 id + 现状态 + 缺什么）并给可执行修法（`sdo_test action=defect defectId=… status=fixed evidence=…`，或补齐免责两字段）。未 done / 未声明 `fixes` 的卡不参与（不误伤）；没有任何完成卡声明 `fixes` ⇒ 判 N/A。**存量不追溯**：`fixes` 是本轮新增字段，新字段生效前建的卡读回来是空集" }
      # **DEF-051 / C-64（TASK-080）**：与 C-63 同族，只是换了一本台账（风险），并顺手把卡级
      # `inputs`/`outputs` 这两格"读了、也下发了、却没人核对"的声明纳进同一条判据。
      # 挂 G5 的理由与 C-63 逐字相同：施工收口时逮住，不拖到发布前。
      - { id: C-64, check: "details.mitigates-closed", desc: "已声明消除的风险必须闭合或署名接受其仍开放，且卡级 inputs/outputs 的声明必须有证据：对每张 status ∈ {done, verified} 的卡，① `mitigates` 每条风险须 `mitigated`/`closed`，或卡上有一条 `waiveReason` 与 `waiveApprovedBy` 去空白后**都非空**的豁免（口径同 DEF-038，不新造）；② 声明的每条 `inputs`/`outputs` 必须出现在该卡自己的 `artifact` 证据里（去 `./` 与前后空白后匹配）；否则判红并**逐条点名**（卡 id + 风险 id / 声明的条目 + 现状态 + 缺什么）并给可执行修法（`sdo_risk action=update id=RISK-xxx status=mitigated`，或补免责两字段，或把产物落盘进 `artifact` 证据）。两种通过路径下回执都**单列台账里仍 open 的风险清单**（可见即约束）。未 done / 三格都没声明的卡不参与（不误伤）；一条声明都没有 ⇒ 判 N/A。**形态判别，不是「恰好为空」**（DEF-064 / REV-043）：②③ 只核对**路径形态**的 `inputs`/`outputs` 声明（去 `./` 与前后空白后匹配该卡自己的 `artifact` 证据）；**散文/描述形态**的声明**不参与判据**，但会**逐条回显未参与的理由**（不静默放过）。**存量不追溯**：两个风险豁免字段是本轮新增" }
  - id: G6
    name: 验证门禁
    criteria:
      # **DEF-075（第三批 §3.8）**：缺陷线补进 G6（与 C-50/C-52 同族）。绑定方式是**TR 带 `defects` 字段**（方案 (a)）：
      # 依据与结论同生共死，不必新增追溯边种类。四流程措辞一致（C-59 / C-64 都栽在"只改一处"上）。
      - { id: C-65, check: "defects.fixed-tested", desc: "已修（fixed）的缺陷必须有**绑定的测试结论**：每条 `fixed` 缺陷至少要有一条 `pass` 的结果把它的 id 写进 `defects`；否则判红并逐条点名（`DEF-xxx 已修但无测试结论`）。`wontfix` 且免责两字段齐备者不算缺依据（口径同 C-51/C-63）；`closed` 不在本条范围（closed 是结果、TR 是依据）" }
      - { id: C-50, check: "tests.passed", desc: "must REQ 测试通过" }
      - { id: C-51, check: "defects.closed", desc: "无未关闭阻塞缺陷" }
      - { id: C-52, check: "review.independent", desc: "评审独立性" }
      - { id: C-53, check: "exit.criteria", desc: "准出准则逐条现算、禁止加权：任一不达标即整体不成立并逐条点名；声明里的权重/得分原样报出但不进判定；找不到实测判红（fail-closed）" }
      - { id: C-57, check: "regression.discipline", desc: "回归一等纪律：影响集里的用例都必须有结果、结果必须绑被测产物哈希；漏跑 / 产物改动后过期 / 影响面推不出来 ⇒ 判红并逐条点名（判定口径由 regression.ts 一份承担）" }
      # **REQ-059 / C-59（TASK-062）**：原型流程同样有 `verification` 阶段（出口就是本门 G6），
      # 该阶段的建议产物也是 TESTREPORT.md ⇒ 报告签字要求与其他流程**同口径同落点**：
      # 挂验证门禁，而不是挂交付门禁（交付门禁管的是"包怎么交"，不重判"验的结论谁认过"）。
      - { id: C-59, check: "testing.report-signed", desc: "测试总结报告已由用户签字确认（四态）：① 报告不在盘 / 不是当前真源的渲染 ⇒ 判红，先 `sdo_render target=report`；② 报告在、但签字台账（.sdo/gates/signatures.yml）里没有本门签字 ⇒ 判红并给可执行修法（`sdo_gate action=sign gate=\"验证门禁（G6）\"`，channel=question 走宿主问答通道弹审核单，或 channel=statement + 用户原话）；③ 有签字但报告内容指纹在签字之后变了（真源被改 / 渲染稿被手改）⇒ 判红并点名「签字已失效，需重签」；④ 报告在 + 存在当前指纹的签字 ⇒ 绿，回执给出报告路径 / 内容指纹 / 签字时刻" }
  - id: G7
    name: 交付门禁
    criteria:
      - { id: C-60, check: "delivery.manifest", desc: "交付清单完整" }
      - { id: C-61, check: "prototype.excluded", desc: "交付包不含 prototype/ 内容" }
      - { id: C-62, check: "prototype.backfilled", desc: "原型结论已回填为需求" }
